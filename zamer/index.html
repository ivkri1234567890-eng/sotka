<script>
'use strict';
/* =================== utilities =================== */
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9);
const num=s=>{const v=parseFloat(String(s==null?'':s).replace(',','.').replace(/\s/g,''));return isFinite(v)?v:0};
const fmt=(n,d=2)=>(+n||0).toLocaleString('ru-RU',{maximumFractionDigits:d});
const rub=n=>Math.round(+n||0).toLocaleString('ru-RU')+' ₽';
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const today=()=>new Date().toLocaleDateString('ru-RU');
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,2200)}
const NATIVE=window.Native||null;

/* =================== storage =================== */
let dbReadError = null, lastWebDB = null;
function loadDB(){
  try {
    const data=NATIVE?NATIVE.load():localStorage.getItem('zs:db');
    if(!NATIVE)lastWebDB=data;
    if(!data)return null;
    const db=JSON.parse(data);
    if(!Array.isArray(db?.projects)||!db.settings)throw Error('Повреждены данные проекта');
    return db;
  }catch(error){dbReadError=error;return null}
}
let DB=loadDB()||{projects:[],settings:{company:'',master:'',phone:'',note:'Цены на материалы ориентировочные и уточняются при закупке. Смета действительна 14 дней.',prices:{},variant:'s'}};
function storageStatus(error){
  let status=document.getElementById('storage-error');
  if(!status&&error){
    status=document.createElement('p');
    status.id='storage-error';
    status.className='card danger';
    status.setAttribute('role','alert');
    document.body.prepend(status);
  }
  if(status){
    status.hidden=!error;
    status.textContent=error?'Ошибка хранения: '+error.message:'';
  }
}
function writeDB(db=DB){
  if(dbReadError)throw dbReadError;
  const data=JSON.stringify(db);
  if(NATIVE){
    const result=NATIVE.save(data);
    if(result===false||NATIVE.load()!==data)throw Error('Приложение не подтвердило запись проекта');
  }else{
    if(data===lastWebDB)return;
    if(localStorage.getItem('zs:db')!==lastWebDB)throw Error('Проекты изменены в другой вкладке. Сохраните копию и перезагрузите страницу');
    localStorage.setItem('zs:db',data);
    lastWebDB=data;
  }
}
function save(){
  try{writeDB();storageStatus(null);return true}
  catch(error){storageStatus(error);return false}
}
function mediaOwners(p){return [...p.rooms,...(p.engMedia?[p.engMedia]:[]),...(p.drawingSource?.id?[{photos:[p.drawingSource]}]:[])]}
function removeProjectsOrRooms(owner,key,remaining,removedRooms){
  const previous=owner[key];
  owner[key]=remaining;
  if(!save()){owner[key]=previous;return false}
  const ids=new Set(removedRooms.flatMap(room=>(room.photos||[]).map(photo=>photo.id)));
  if(ids.size){
    for(const project of DB.projects)for(const room of mediaOwners(project)){
      for(const photo of room.photos||[])ids.delete(photo.id);
    }
    if(ids.size)PHDB.removeAll([...ids]).catch(storageStatus);
  }
  return true;
}
window.flushDb=()=>{
  const el=document.activeElement;
  if(el?.dataset?.f)el.dispatchEvent(new Event('change',{bubbles:true}));
  return save();
};
document.addEventListener('visibilitychange',()=>{if(document.hidden)window.flushDb()});

/* =================== price list =================== */
/* b = база количества (floor, ceil, wall, perim, skirt, slopes, demo, el, pl, doorsN), k = расход на единицу базы, c = округлять вверх до целых упаковок, p = цены [эконом, стандарт, премиум] */
const CAT={

/* =================== geometry =================== */
function planPts(room){const pts=[[0,0]];let h=room.drawingHeading||0;(room.walls||[]).forEach((w,i)=>{if(i>0)h+=num(w.t);const r=h*Math.PI/180,[x,y]=pts[pts.length-1];pts.push([x+num(w.len)*Math.cos(r),y+num(w.len)*Math.sin(r)])});return{pts,heading:h}}
function geo(room){
 const {pts,heading}=planPts(room),n=(room.walls||[]).length,last=pts[n],gap=Math.hypot(last[0],last[1]);
 const closed=n>=3&&gap<0.03;const P=closed?pts.slice(0,n):pts;let A=0;
 if(P.length>=3)for(let i=0;i<P.length;i++){const a=P[i],b=P[(i+1)%P.length];A+=a[0]*b[1]-b[0]*a[1]}
 const floor=Math.abs(A)/2,perim=(room.walls||[]).reduce((s,w)=>s+num(w.len),0),h=num(room.h),ops=room.ops||[];
 const openA=ops.reduce((s,o)=>s+num(o.w)*num(o.h),0),doorW=ops.filter(o=>o.type==='door').reduce((s,o)=>s+num(o.w),0);
 const slopes=ops.reduce((s,o)=>s+2*num(o.h)+num(o.w),0),wallGross=perim*h,wall=Math.max(0,wallGross-openA),cnt=room.cnt||{};
 return{pts,heading,closed,gap,sign:A>=0?1:-1,floor,ceil:floor,perim,h,wallGross,openA,wall,skirt:Math.max(0,perim-doorW),slopes,demo:floor+wall,el:num(cnt.el),pl:num(cnt.pl),doorsN:num(cnt.doorsN)};
}
function roomItems(room){const f=room.fin||{},ids=[];for(const k of ['floor','walls','ceiling'])ids.push(...FIN[k].opts[f[k]||'none'].items);
 for(const x of EXTRA)if(f[x.id])ids.push(...x.items);for(const c of COUNTS)if(num((room.cnt||{})[c.id])>0)ids.push(c.item);return [...new Set(ids)]}
function roomLines(room,v){const g=geo(room),L=[];
 for(const id of roomItems(room)){const it=CAT[id];let q=(g[it.b]||0)*it.k;q=it.c?Math.ceil(q-1e-9):Math.round(q*100)/100;if(q<=0)continue;const ov=(room.rates||{})[id]||{};const pr=Object.prototype.hasOwnProperty.call(ov,v)?ov[v]:priceOf(id,v);L.push({id,g:it.g,n:it.n,u:it.u,q,pr,sum:q*pr})}
 (room.custom||[]).forEach((c,ci)=>{const q=num(c.q),pr=c.rates&&Object.prototype.hasOwnProperty.call(c.rates,v)?c.rates[v]:num(c.p);if(q&&c.n)L.push({g:c.g||'w',n:c.n,u:c.u||'шт',q,pr,sum:q*pr,custom:1,ci})});
 return L}
function projTotals(p,v){let w=0,m=0;const rooms=(p.rooms||[]).map(r=>{const L=roomLines(r,v),rw=L.filter(l=>l.g==='w').reduce((s,l)=>s+l.sum,0),rm=L.filter(l=>l.g==='m').reduce((s,l)=>s+l.sum,0);w+=rw;m+=rm;return{r,L,rw,rm,g:geo(r)}});
 const sub=w+m,disc=sub*num(p.disc)/100,total=sub-disc,adv=total*num(p.adv)/100;return{rooms,w,m,sub,disc,total,adv}}

/* =================== plan drawing (shared by screen and PDF) =================== */
function openingPrims(o,pts,scale,sign=1){const a=pts[num(o.wall)-1],b=pts[num(o.wall)];if(!a||!b)return null;const dx=b[0]-a[0],dy=b[1]-a[1],L=Math.hypot(dx,dy);if(L<1e-6)return null;const width=Math.min(num(o.w)*scale,L),offset=o.offset==null?(L-width)/2:Math.max(0,Math.min(num(o.offset)*scale,L-width)),ux=dx/L,uy=dy/L;return{type:o.type,a:[a[0]+ux*offset,a[1]+uy*offset],b:[a[0]+ux*(offset+width),a[1]+uy*(offset+width)],nx:uy*sign,ny:-ux*sign,len:width,sign}}
function openingSVG(op,small=false){if(!op)return '';const[a,b,L]=[op.a,op.b,op.len],line=(a,b,c,w)=>`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${c}" stroke-width="${w}"/>`;let h=line(a,b,'white',small?4:10);if(op.type==='door'){const leaf=[a[0]-op.nx*L,a[1]-op.ny*L];h+=line(a,leaf,'#d96920',small?1:2)+`<path class="door-arc" d="M ${b.join(' ')} A ${L} ${L} 0 0 ${op.sign>0?1:0} ${leaf.join(' ')}" fill="none" stroke="#d96920" stroke-width="1.2"/>`}else{for(const v of [-2,2])h+=line([a[0]+op.nx*v,a[1]+op.ny*v],[b[0]+op.nx*v,b[1]+op.ny*v],'#238ab6',small?1:2);h+=line([a[0]-op.nx*4,a[1]-op.ny*4],[a[0]+op.nx*4,a[1]+op.ny*4],'#238ab6',2)+line([b[0]-op.nx*4,b[1]-op.ny*4],[b[0]+op.nx*4,b[1]+op.ny*4],'#238ab6',2)}return `<g class="${op.type==='door'?'op-door':'op-window'}">${h}</g>`}
function openingCanvas(ctx,op){if(!op)return;ctx.save();const line=(a,b,c,w)=>{ctx.beginPath();ctx.moveTo(...a);ctx.lineTo(...b);ctx.strokeStyle=c;ctx.lineWidth=w;ctx.stroke()};const[a,b,L]=[op.a,op.b,op.len];line(a,b,'white',8);if(op.type==='door'){const leaf=[a[0]-op.nx*L,a[1]-op.ny*L];line(a,leaf,'#d96920',1.3);ctx.beginPath();const angle=Math.atan2(b[1]-a[1],b[0]-a[0]);ctx.arc(a[0],a[1],L,angle,angle+op.sign*Math.PI/2,op.sign<0);ctx.lineWidth=1;ctx.strokeStyle='#d96920';ctx.stroke()}else{for(const v of [-2,2])line([a[0]+op.nx*v,a[1]+op.ny*v],[b[0]+op.nx*v,b[1]+op.ny*v],'#238ab6',1.5);for(const q of[a,b])line([q[0]-op.nx*4,q[1]-op.ny*4],[q[0]+op.nx*4,q[1]+op.ny*4],'#238ab6',1.5)}ctx.restore()}

function planPrims(room,W,H,pad){
 const g=geo(room),pts=g.pts,n=room.walls.length;const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]);
 let minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys);const span=Math.max(maxX-minX,maxY-minY,1);
 if(maxX-minX<0.5){minX-=1;maxX+=1}if(maxY-minY<0.5){minY-=1;maxY+=1}
 const s=Math.min((W-2*pad)/(maxX-minX||1),(H-2*pad)/(maxY-minY||1));const ox=(W-(maxX-minX)*s)/2-minX*s,oy=(H-(maxY-minY)*s)/2-minY*s;
 const T=p=>[ox+p[0]*s,oy+p[1]*s];const sp=pts.map(T);const walls=[];
 for(let i=0;i<n;i++){const a=sp[i],b=sp[i+1],dx=b[0]-a[0],dy=b[1]-a[1],L=Math.hypot(dx,dy)||1;const nx=dy/L*g.sign,ny=-dx/L*g.sign;
  walls.push({a,b,i,len:num(room.walls[i].len),mid:[(a[0]+b[0])/2,(a[1]+b[1])/2],nx,ny,ang:Math.atan2(dy,dx)})}
 const ops=(room.ops||[]).map(o=>openingPrims(o,sp,s,g.sign)).filter(Boolean);
 return{g,sp,walls,ops,s,closed:g.closed,end:sp[n],heading:g.heading,span}}
const FLOORC=room=>FIN.floor.opts[(room.fin||{}).floor||'none'].c;
function wallColor(room){const f=room.fin||{};if(f.walls==='tile')return '#9fb4c2';if(f.walls==='paint'||f.walls==='wallpaper')return room.wc||'#d9cbb5';return '#3a3d42'}
function planSVG(room,W,H,opts={}){
 if(!room.walls.length)return `<svg viewBox="0 0 ${W} ${H}" class="${opts.cls||''}"><text x="${W/2}" y="${H/2}" text-anchor="middle" fill="currentColor" opacity=".5" font-size="${opts.small?10:15}">${opts.small?'нет замеров':'Сделайте первый замер стены'}</text></svg>`;
 const P=planPrims(room,W,H,opts.small?6:46),fs=opts.small?0:13;let o=`<svg viewBox="0 0 ${W} ${H}" class="${opts.cls||''}" xmlns="http://www.w3.org/2000/svg">`;
 const poly=P.sp.slice(0,P.closed?-1:undefined).map(p=>p.join(',')).join(' ');
 if(P.closed)o+=`<polygon points="${poly}" fill="${FLOORC(room)}" opacity=".55"/>`;
 const wc=wallColor(room);
 P.walls.forEach(w=>{o+=`<line x1="${w.a[0]}" y1="${w.a[1]}" x2="${w.b[0]}" y2="${w.b[1]}" data-a="selectwall" data-i="${w.i}" stroke="${wc}" stroke-width="${opts.small?3:8}" stroke-linecap="round"/>`;
  o+=`<line x1="${w.a[0]}" y1="${w.a[1]}" x2="${w.b[0]}" y2="${w.b[1]}" pointer-events="none" stroke="#1d1f22" stroke-opacity=".35" stroke-width="${opts.small?.6:1.2}"/>`});
 P.ops.forEach(op=>{o+=openingSVG(op,opts.small)});
 if(!opts.small){P.walls.forEach(w=>{const lx=w.mid[0]+w.nx*22,ly=w.mid[1]+w.ny*22;
   o+=`<text x="${lx}" y="${ly}" text-anchor="middle" dominant-baseline="middle" font-size="${fs}" font-weight="700" fill="currentColor" paint-order="stroke" stroke="var(--surface)" stroke-width="4">${fmt(w.len,2)}</text>`;
   const ix=w.mid[0]-w.nx*16,iy=w.mid[1]-w.ny*16;o+=`<circle cx="${ix}" cy="${iy}" r="9" fill="var(--acc)"/><text x="${ix}" y="${iy}" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="700" fill="var(--acc-ink)">${w.i+1}</text>`});
  o+=`<circle cx="${P.sp[0][0]}" cy="${P.sp[0][1]}" r="5" fill="var(--ok)"/>`;
  if(!P.closed){const r=P.heading*Math.PI/180,e=P.end;o+=`<circle cx="${e[0]}" cy="${e[1]}" r="6" fill="var(--acc)"/><line x1="${e[0]}" y1="${e[1]}" x2="${e[0]+Math.cos(r)*26}" y2="${e[1]+Math.sin(r)*26}" stroke="var(--acc)" stroke-width="2" stroke-dasharray="4 3"/>`}}
 return o+'</svg>'}
function planCanvas(ctx,room,x,y,W,H){
 ctx.save();ctx.translate(x,y);ctx.strokeStyle='#ccc';ctx.lineWidth=.5;ctx.strokeRect(0,0,W,H);
 if(!room.walls.length){ctx.fillStyle='#888';ctx.font='10px '+PF;ctx.fillText('Нет замеров',10,20);ctx.restore();return}
 const P=planPrims(room,W,H,34);
 if(P.closed){ctx.beginPath();P.sp.slice(0,-1).forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();ctx.globalAlpha=.45;ctx.fillStyle=FLOORC(room);ctx.fill();ctx.globalAlpha=1}
 ctx.lineCap='round';P.walls.forEach(w=>{ctx.strokeStyle='#33363a';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(...w.a);ctx.lineTo(...w.b);ctx.stroke()});
 P.ops.forEach(op=>openingCanvas(ctx,op));
 ctx.textAlign='center';ctx.textBaseline='middle';
 P.walls.forEach(w=>{const lx=w.mid[0]+w.nx*14,ly=w.mid[1]+w.ny*14;ctx.font='bold 9px '+PF;ctx.lineWidth=3;ctx.strokeStyle='#fff';ctx.strokeText(fmt(w.len,2),lx,ly);ctx.fillStyle='#111';ctx.fillText(fmt(w.len,2),lx,ly);
  const ix=w.mid[0]-w.nx*11,iy=w.mid[1]-w.ny*11;ctx.fillStyle='#e0620d';ctx.beginPath();ctx.arc(ix,iy,6,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.font='bold 7px '+PF;ctx.fillText(w.i+1,ix,iy+.3)});
 ctx.restore()}

/* =================== rangefinder (Bosch GLM over BLE) =================== */
const SVC='02a6c0d0-0451-4000-b000-fb3210111989',CHR='02a6c0d1-0451-4000-b000-fb3210111989';
const BLE={state:'off',name:'',log:[],webChr:null};
function bleLog(s){BLE.log.push(new Date().toLocaleTimeString('ru-RU')+' '+s);if(BLE.log.length>60)BLE.log.shift();if(R.view==='settings')render()}
function parseFrame(bytes){
 bleLog('← '+[...bytes].map(b=>b.toString(16).padStart(2,'0')).join(' '));
 if(bytes.length>=11&&bytes[0]===0xC0&&bytes[1]===0x55&&bytes[2]===0x10){const dv=new DataView(new Uint8Array(bytes).buffer);const v=dv.getFloat32(7,true);if(isFinite(v)&&v>0.02&&v<300)onMeasure(Math.round(v*1000)/1000)}}
window.glmEvent=e=>{if(e.type==='status'){BLE.state=e.state;BLE.name=e.name||BLE.name;if(e.text)toast(e.text);render()}
 else if(e.type==='frame'){parseFrame(e.hex.match(/../g).map(h=>parseInt(h,16)))}else if(e.type==='log')bleLog(e.text)};
async function bleConnect(){
 if(NATIVE){NATIVE.bleConnect();BLE.state='connecting';render();return}
 if(!navigator.bluetooth){toast('В этом браузере нет Bluetooth. Вводите замеры вручную или используйте приложение для Android.');return}
 try{BLE.state='connecting';render();
  const dev=await navigator.bluetooth.requestDevice({filters:[{namePrefix:'GLM'},{namePrefix:'Bosch'},{services:[SVC]}],optionalServices:[SVC]});
  dev.addEventListener('gattserverdisconnected',()=>{BLE.state='off';render();toast('Дальномер отключён')});
  const srv=await (await dev.gatt.connect()).getPrimaryService(SVC),ch=await srv.getCharacteristic(CHR);
  await ch.startNotifications();ch.addEventListener('characteristicvaluechanged',e=>parseFrame(new Uint8Array(e.target.value.buffer)));
  await ch.writeValue(new Uint8Array([0xC0,0x55,0x02,0x01,0x00,0x1A]));BLE.webChr=ch;BLE.state='on';BLE.name=dev.name||'GLM';render();toast('Дальномер подключён')}
 catch(e){BLE.state='off';render();toast('Не удалось подключиться: '+e.message)}}
function bleMeasure(){if(NATIVE)NATIVE.bleMeasure();else if(BLE.webChr)BLE.webChr.writeValue(new Uint8Array([0xC0,0x56,0x01,0x00,0x1E])).catch(()=>{})}

let R={view:'home',pid:null,rid:null,tab:'rooms'};const STACK=[];
const UI={last:null,target:'wall',turn:90,auto:true,opType:'door'};
function go(v,extra={}){if(v==='room')UI.phWall=null;STACK.push({...R});R={...R,view:v,...extra};render();window.scrollTo(0,0)}
function back(){if(!STACK.length)return false;R=STACK.pop();render();return true}
window.appBack=()=>back();
const P=()=>DB.projects.find(p=>p.id===R.pid);
const RM=()=>{const p=P();return p&&p.rooms.find(r=>r.id===R.rid)};

function onMeasure(v){
 UI.last=v;const room=R.view==='room'?RM():null;
 if(!room){render();toast('Замер '+fmt(v,3)+' м — откройте помещение');return}
 if(UI.target==='wall'){if(room.closed){toast('Контур замкнут. Чтобы добавить стену, удалите последнюю или выберите «Высота»/«Проём»');render();return}
  if(UI.auto){addWall(room,v);toast('Стена '+room.walls.length+': '+fmt(v,3)+' м')}else{render();const i=$('#wlen');if(i)i.value=fmt(v,3)}}
 else if(UI.target==='height'){room.h=v;UI.target='wall';save();render();toast('Высота потолка: '+fmt(v,3)+' м')}
 else if(UI.target==='opw'||UI.target==='opready'){UI.opw=v;UI.oph=null;UI.target='oph';render();toast('Ширина проёма '+fmt(v,3)+'. Теперь высоту')}
 else if(UI.target==='oph'){UI.oph=v;UI.target='opready';render();toast('Высота проёма '+fmt(v,3)+' — нажмите «Добавить проём»')}
}
function addWall(room,len){if(len<=0)return;room.walls.push({len:Math.round(len*1000)/1000,t:room.walls.length?UI.turn:0});const g=geo(room);room.closed=g.closed;save();render()}
function closeRoom(room){const g=geo(room);if(room.walls.length<2){toast('Нужно минимум две стены');return}
 const e=g.pts[room.walls.length],d=Math.hypot(e[0],e[1]);if(d<0.03){room.closed=true;save();render();return}
 let t=Math.atan2(-e[1],-e[0])*180/Math.PI-g.heading;t=((t%360)+540)%360-180;room.walls.push({len:Math.round(d*1000)/1000,t:Math.round(t*10)/10});room.closed=true;save();render();toast('Контур замкнут: добавлена стена '+fmt(d,3)+' м')}

   <p class="small muted">Нажмите на цену, чтобы поставить свою. Для «Эконом», «Стандарт» и «Премиум» цены сохраняются отдельно в этом помещении. Общий прайс — в Настройках.</p>`}

function render(){
 const fx=document.activeElement&&document.activeElement.dataset?document.activeElement.dataset.f:null;

 app.innerHTML=R.view==='home'?vHome():R.view==='project'?vProject():R.view==='room'?vRoom():R.view==='settings'?vSettings():R.view==='prices'?vPrices():vHome();
 const step=app.querySelector('.steps28 .on');
 if(step){
   const strip=step.parentElement, bounds=strip.getBoundingClientRect(), active=step.getBoundingClientRect();
   if(active.left<bounds.left||active.right>bounds.right)strip.scrollLeft+=active.left-bounds.left-(strip.clientWidth-step.offsetWidth)/2;
 }
 if(wasMinorOpen&&app.querySelector('#minorWorks'))app.querySelector('#minorWorks').open=true;
 if(fx){const el=app.querySelector(`[data-f="${fx}"]`);if(el){el.focus();try{const l=el.value.length;el.setSelectionRange(l,l)}catch(e){}}}}

async function exportProjectZip(project,button){
  if(!project||button.disabled)return;
  button.disabled=true;
  try{

async function projectDocuments(project){

  add('foreman.csv',utf8(foremanCSV(project)));
  const sheets=allSheets27(project).concat(await engPhotoSheets(project)),canvases=[];
  for(const [index,sheet] of sheets.entries()){

async function importProjectZip(file){
  const {backup,records,source}=await ZamerZip.decode(file);
  validateBackup(backup);
  const project=backup.projects[0],photos=[];
  const matches=DB.projects.some(p=>p.id===project.id);
  if(!confirm(matches?'Такой проект уже есть. Импортировать отдельную копию?':'Импортировать проект «'+(project.name||'Объект')+'»?'))return;
  if(matches){project.id=uid()+uid();project.name=(project.name||'Объект')+' (копия)'}
  const applySettings=confirm('Применить общие настройки и прайс из ZIP ко всему приложению?');
  for(const room of [...project.rooms,...(project.engMedia?[project.engMedia]:[])]){
    for(const photo of room.photos||[]){
      const key=JSON.stringify([room.id,photo.id]),record=records.get(key);
      if(!record)throw Error('Отсутствует фото комнаты '+(room.name||room.id));
      records.delete(key);
      photo.id=uid()+uid();
      photos.push({...record,id:photo.id,projectId:project.id,roomId:room.id});
    }
  }
  if(records.size)throw Error('ZIP содержит фотографии без привязки к помещениям');
  if(source){project.drawingSource.id=uid()+uid();photos.push({id:project.drawingSource.id,source,projectId:project.id})}
  if(photos.length)await PHDB.putAll(photos);
  const next={...DB,projects:[...DB.projects,project],settings:applySettings?{...DB.settings,...backup.settings}:DB.settings};
  try{
    if(DB.projects.some(p=>p.id===project.id))throw Error('Проект с этим идентификатором уже существует');
    writeDB(next);
  }catch(error){
    if(!NATIVE&&photos.length)await PHDB.removeAll(photos.map(photo=>photo.id)).catch(console.warn);
    throw error;
  }
  DB.projects=next.projects;
  DB.settings=next.settings;
  storageStatus(null);
  STACK.length=0;
  R={view:'project',pid:project.id,rid:null,tab:'rooms'};
  render();
  toast('Проект восстановлен из ZIP');
}

window.importBackup=text=>{
  try{
    const data=typeof text==='string'?JSON.parse(text):text;
    validateBackup(data);
    if(!confirm('Добавить '+data.projects.length+' объектов из копии? Совпадающие объекты будут добавлены как отдельные копии. Текущие данные останутся.'))return false;
    const ids=new Set(DB.projects.map(project=>project.id));
    const projects=data.projects.map(source=>{
      const project=JSON.parse(JSON.stringify(source));
      if(project.drawingSource?.id){delete project.drawingSource;project.drawingSourceOmitted=true}
      if(ids.has(project.id)){project.id=uid();project.name=(project.name||'Объект')+' (копия)'}
      ids.add(project.id);
      return project;
    });
    const settings=DB.settings.company||DB.settings.master?DB.settings:{...DB.settings,...data.settings};
    const next={...DB,projects:[...DB.projects,...projects],settings};
    writeDB(next);
    DB.projects=next.projects;
    DB.settings=next.settings;
    storageStatus(null);
    R={view:'home',pid:null,rid:null,tab:'rooms'};
    STACK.length=0;
    render();
    toast('Резервная копия восстановлена');
    return true;
  }catch(error){toast('Копия не загружена: '+error.message);return false}
};

/* Text from a rangefinder or keyboard: "1.234", "1,234 m", "D=1234mm", "4' 6.5\"" → metres or null. */
function parseText24(raw,unitPref){

/* Binary decoders used by learned profiles. */
const DEC={
 f32le:(d,o)=>d.getFloat32(o,true),f32be:(d,o)=>d.getFloat32(o,false),f64le:(d,o)=>d.getFloat64(o,true),

 u32le:(d,o)=>d.getUint32(o,true),u32be:(d,o)=>d.getUint32(o,false),i32le:(d,o)=>d.getInt32(o,true)};
const DEC_SIZE={f32le:4,f32be:4,f64le:8,u16le:2,u16be:2,u24le:3,u24be:3,u32le:4,u32be:4,i32le:4};
function decode24(bytes,pr){try{if(pr.type==='text')return parseText24(String.fromCharCode(...bytes),pr.unit);if(pr.off+DEC_SIZE[pr.type]>bytes.length)return null;const v=DEC[pr.type](new DataView(new Uint8Array(bytes).buffer),pr.off)*pr.k;return okLen(v)?Math.round(v*1000)/1000:null}catch(e){return null}}
const isText=b=>b.length&&b.every(x=>x===9||x===10||x===13||x>=32&&x<127)&&b.some(x=>x>=48&&x<=57);
/* Finds the field in the last frame that equals the value shown on the device. */
function learn24(bytes,target){const out=[],d=new DataView(new Uint8Array(bytes).buffer);
 if(isText(bytes)){const v=parseText24(String.fromCharCode(...bytes));if(v!=null&&Math.abs(v-target)<=.002)out.push({type:'text',off:0,k:1})}
 for(const[type,size]of Object.entries(DEC_SIZE))for(let off=0;off+size<=bytes.length;off++)for(const k of type[0]==='f'?[1,.001,.3048]:[.001,.0001,.01,.1]){let raw;try{raw=DEC[type](d,off)}catch(e){continue}const v=raw*k;if(Number.isFinite(v)&&Math.abs(v-target)<=.0015)out.push({type,off,k})}
 return out}

function measure24(v){const t=Date.now();if(BLE.lastVal&&BLE.lastVal.v===v&&t-BLE.lastVal.t<500)return;BLE.lastVal={v,t};onMeasure(v)}

 BLE.lastFrame={bytes,chr,name:devName,at:Date.now()};
 if(proto==='bosch'||(bytes[0]===0xC0&&bytes[1]===0x55&&proto!=='spp')){parseFrame(bytes);return}
 bleLog('← '+(chr?chr.slice(0,8)+' ':'')+bytes.map(b=>b.toString(16).padStart(2,'0')).join(' '));
 const pr=rfS().profiles[devName];
 if(pr&&(!pr.chr||pr.chr===chr||pr.type==='text')){if(pr.type==='text'){BLE.buf+=String.fromCharCode(...bytes);clearTimeout(BLE.bufT);if(/[\r\n]/.test(BLE.buf))flushText24();else BLE.bufT=setTimeout(flushText24,200);return}const v=decode24(bytes,pr);if(v!=null)measure24(v);return}

 if(isText(bytes)){BLE.buf+=String.fromCharCode(...bytes);clearTimeout(BLE.bufT);if(/[\r\n]/.test(BLE.buf))flushText24();else BLE.bufT=setTimeout(flushText24,200);return}

const PHDB={
  db:null,
  async open(){
    if(!this.db)this.db=new Promise((resolve,reject)=>{
      const request=indexedDB.open('zamer-photos',1);
      request.onupgradeneeded=()=>request.result.createObjectStore('ph',{keyPath:'id'});
      request.onsuccess=()=>{
        const db=request.result;
        db.onversionchange=()=>{db.close();this.db=null};
        db.onclose=()=>{this.db=null};
        resolve(db);
      };
      request.onerror=()=>reject(request.error);
    }).catch(error=>{this.db=null;throw error});
    return this.db;
  },
  async putAll(records){
    const db=await this.open();
    const write=batch=>new Promise((resolve,reject)=>{
      const tx=db.transaction('ph','readwrite');
      tx.oncomplete=()=>resolve();
      tx.onabort=()=>reject(tx.error||Error('Запись фотографий прервана'));
      try{
        const store=tx.objectStore('ph');
        for(const record of batch)store.add(record);
      }catch(error){tx.abort();reject(error)}
    });
    try{await write(records)}catch(error){
      if(!['DataCloneError','UnknownError'].includes(error.name)&&!/preparing Blob|serialize.*(Blob|File)/i.test(error.message))throw error;
      const batch=[];
      for(const record of records){const copy={...record};for(const key of ['original','source'])if(copy[key] instanceof Blob){
        copy[key+'Buffer']=await copy[key].arrayBuffer();copy[key+'Mime']=copy[key].type;delete copy[key];
      }batch.push(copy)}
      await write(batch);
    }
  },
  async get(id){
    const db=await this.open();
    return new Promise((resolve,reject)=>{
      const tx=db.transaction('ph');
      const request=tx.objectStore('ph').get(id);
      tx.oncomplete=()=>{const r=request.result;if(r)for(const k of ['original','source'])if(!r[k]&&r[k+'Buffer']){r[k]=new Blob([r[k+'Buffer']],{type:r[k+'Mime']||''});delete r[k+'Buffer'];delete r[k+'Mime']}resolve(r||null)};
      tx.onabort=()=>reject(tx.error||Error('Чтение фотографии прервано'));
    });
  },
  async removeAll(ids){
    const db=await this.open();
    return new Promise((resolve,reject)=>{
      const tx=db.transaction('ph','readwrite');
      const store=tx.objectStore('ph');
      tx.oncomplete=()=>resolve();
      tx.onabort=()=>reject(tx.error||Error('Удаление фотографий прервано'));
      for(const id of ids)store.delete(id);
    });
  }
};

  lines.push('');
 }
 return lines.join('\r\n');
}
function saveSurveyField(event){
 const el=event.target,key=el?.dataset?.surveyKey,field=el?.dataset?.surveyField;
 if(!SURVEY_FIELDS.some(([name])=>name===key)||!['status','notes'].includes(field))return;
 if(event.type==='input'&&field!=='notes')return;
 const room=RM();
 if(!room)return;
 const previous=room.surveyTZ;
 const value=field==='notes'?el.value.slice(0,4000):el.value;
 if(field==='status'&&!SURVEY_STATUS.some(([status])=>status===value))return;
 if(previous?.[key]?.[field]===value)return;
 room.surveyTZ={...previous,[key]:{...previous?.[key],[field]:value}};
 if(!save()){
  if(previous===undefined)delete room.surveyTZ;
  else room.surveyTZ=previous;
  el.value=previous?.[key]?.[field]||'';
  return;
 }
 if(field==='status'){
  const summary=el.closest('details')?.querySelector('summary');
  if(summary)summary.innerHTML='<b>'+esc(SURVEY_FIELDS.find(([name])=>name===key)[1])+'</b> · '+esc(SURVEY_STATUS.find(([status])=>status===value)[1]);
  const progress=document.querySelector('[data-survey-progress]');
  if(progress)progress.textContent=surveyCompleted(room);
 }
}
document.addEventListener('input',saveSurveyField);
document.addEventListener('change',saveSurveyField);
document.addEventListener('click',event=>{
 if(!event.target.closest('[data-survey-export]'))return;

 if(project)outFile((project.name||'Объект')+' — ведомость обмера.txt','text/plain;charset=utf-8',utf8('\ufeff'+surveyText(project)),'save');
});

<script>
if('serviceWorker' in navigator && window.isSecureContext && /^https?:$/.test(location.protocol)){
  function offlineError(){
    let status=document.getElementById('offline-error');
    if(!status){
      status=document.createElement('p');
      status.id='offline-error';
      status.className='card danger';
      status.setAttribute('role','alert');
      document.body.prepend(status);
    }
    status.textContent='Не удалось подготовить эту версию для работы без сети. Откройте страницу повторно при наличии связи.';
  }
  navigator.serviceWorker.register('sw.js',{scope:'./'}).then(reg=>{
    const observe=()=>{
      const worker=reg.installing;
      if(worker)worker.addEventListener('statechange',()=>{
        if(worker.state==='redundant')offlineError();
        if(worker.state==='installed')document.getElementById('offline-error')?.remove();
      });
    };
    observe();
    reg.addEventListener('updatefound',observe);
  }).catch(offlineError);
}
</script>
