name: 3D Сканер — сборка для iPhone
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["ios-scan/**", ".github/workflows/ios-scan.yml"]
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: ios-scan
    steps:
      - uses: actions/checkout@v4
      - name: Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build
        id: build
        run: |
          set -o pipefail
          xcodebuild -project Scan3D.xcodeproj -scheme Scan3D -configuration Release -sdk iphoneos \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build 2>&1 | tee build.log | tail -40
      - name: Package IPA
        if: success()
        run: |
          mkdir -p Payload ../scan/ios
          cp -R build/Build/Products/Release-iphoneos/Scan3D.app Payload/
          zip -qry ../scan/ios/Scan3D-1.0.ipa Payload
          echo "ok $(date -u +%FT%TZ) ${GITHUB_SHA}" > ../scan/ios/build-status.txt
      - name: Failure log
        if: failure()
        run: |
          mkdir -p ../scan/ios
          { echo "failed $(date -u +%FT%TZ) ${GITHUB_SHA}"; grep -E "error:|warning: .*deprecated|BUILD FAILED" build.log | head -80; tail -60 build.log; } > ../scan/ios/build-status.txt || echo "failed (no log)" > ../scan/ios/build-status.txt
      - name: Publish result
        if: always()
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scan/ios
          git commit -m "Сборка iPhone (сканер): $(head -c 60 scan/ios/build-status.txt)" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
