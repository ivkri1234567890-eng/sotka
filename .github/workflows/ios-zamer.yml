name: Замер и смета — сборка для iPhone
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["ios-zamer/**", ".github/workflows/ios-zamer.yml"]
permissions:
  contents: write
concurrency:
  group: ios-zamer
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-14
    defaults:
      run:
        working-directory: ios-zamer
    steps:
      - uses: actions/checkout@v4
      - name: Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build
        id: build
        run: |
          set -o pipefail
          xcodebuild -project ZamerSmeta.xcodeproj -scheme ZamerSmeta -configuration Release -sdk iphoneos \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build 2>&1 | tee build.log | tail -40
      - name: Package IPA
        if: success()
        run: |
          mkdir -p Payload ../zamer/ios
          cp -R build/Build/Products/Release-iphoneos/ZamerSmeta.app Payload/
          zip -qry ../zamer/ios/ZamerSmeta-2.5.ipa Payload
          echo "ok $(date -u +%FT%TZ) ${GITHUB_SHA}" > ../zamer/ios/build-status.txt
      - name: Failure log
        if: failure()
        run: |
          mkdir -p ../zamer/ios
          { echo "failed $(date -u +%FT%TZ) ${GITHUB_SHA}"; grep -E "error:|warning: .*deprecated|BUILD FAILED" build.log | head -80; tail -60 build.log; } > ../zamer/ios/build-status.txt || echo "failed (no log)" > ../zamer/ios/build-status.txt
      - name: Publish result
        if: always()
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add zamer/ios
          git commit -m "Сборка iPhone: $(head -c 60 zamer/ios/build-status.txt)" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
