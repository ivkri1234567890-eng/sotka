name: Форма — сборка и проверка Android в эмуляторе
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["forma-src/**", "forma/android/**", ".github/workflows/forma-android.yml"]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Тесты ядра и сборка из исходников
        working-directory: forma-src
        run: |
          npm ci
          npx vitest run
          npx vite build
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon -q
          ls -la app/build/outputs/apk/debug/
      - name: Проверяется опубликованный APK
        run: cp forma/android/Forma-1.0.0.apk forma-src/android/app/build/outputs/apk/debug/app-debug.apk
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Эмулятор Android 13 (API 33) — сценарий без интернета
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash forma-src/android/ci/emulator-test.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forma-emulator
          path: forma-src/android/ci-out/
