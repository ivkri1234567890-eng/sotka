name: Check signed Android update
on:
  push:
    branches: [qa/zamer-android-3-install]
permissions:
  contents: read
jobs:
  install:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - name: Download and verify the public installers
        run: |
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          curl --fail --location --retry 3 -o old.apk 'https://raw.githubusercontent.com/ivkri1234567890-eng/sotka/fd4f0cc1b9ba13cf3010a2085a3f3281beb051c8/zamer/android/ZamerSmeta-2.8.apk'
          curl --fail --location --retry 3 -o release.zip 'https://github.com/ivkri1234567890-eng/sotka/releases/download/zamer-android-3.0/ZamerSmeta-3.0-Android.zip'
          echo 'd84c3d9298acddd43822ca0d683321b5787ca643766558f461ebd96c50a3f2c5  release.zip' | sha256sum -c -
          unzip release.zip
          echo '4775e0372455909502adffcda2cc5e77d2e03c2b779598523dac7d13666d220e  ZamerSmeta-3.0.apk' | sha256sum -c -
      - name: Start Android 15
        shell: bash
        run: |
          set -eu
          sudo chmod 666 /dev/kvm
          image='system-images;android-35;google_apis;x86_64'
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "emulator" "platform-tools" "$image" > /tmp/android-setup.log
          export ANDROID_AVD_HOME="$RUNNER_TEMP/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n survey -k "$image" -d pixel_5 -p "$ANDROID_AVD_HOME/survey.avd"
          printf 'avd.ini.encoding=UTF-8\npath=%s\ntarget=android-35\n' "$ANDROID_AVD_HOME/survey.avd" > "$ANDROID_AVD_HOME/survey.ini"
          "$ANDROID_HOME/emulator/emulator" -avd survey -port 5554 -accel on -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -memory 2048 > /tmp/survey-emulator.log 2>&1 &
          timeout 160 adb wait-for-device || { tail -50 /tmp/survey-emulator.log; exit 1; }
          for n in {1..100}; do
            if [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1 ]; then exit 0; fi
            sleep 3
          done
          tail -50 /tmp/survey-emulator.log
          exit 1
      - name: Install 2.8, update in place and launch 3.0
        shell: bash
        run: |
          set -eu
          pkg=ru.zamer.smeta.pro24
          adb install --no-streaming old.apk
          adb shell dumpsys package "$pkg" > /tmp/before.txt
          grep 'versionName=2.8' /tmp/before.txt
          adb install -r --no-streaming ZamerSmeta-3.0.apk
          adb shell dumpsys package "$pkg" > /tmp/after.txt
          grep 'versionName=3.0' /tmp/after.txt
          grep 'versionCode=30' /tmp/after.txt
          before=$(awk -F= '/firstInstallTime=/{print $2;exit}' /tmp/before.txt)
          after=$(awk -F= '/firstInstallTime=/{print $2;exit}' /tmp/after.txt)
          test -n "$before"
          test "$before" = "$after"
          adb shell input keyevent KEYCODE_WAKEUP
          adb shell wm dismiss-keyguard
          adb shell am start -W -n "$pkg/ru.zamer.smeta.ActivationActivity" | tee /tmp/start.txt
          grep 'Status: ok' /tmp/start.txt
          sleep 2
          adb shell pidof "$pkg"
          adb shell dumpsys activity activities | grep -m1 -E 'mResumedActivity.*ru.zamer.smeta|topResumedActivity.*ru.zamer.smeta' || adb shell dumpsys window | grep -m1 'mCurrentFocus.*ru.zamer.smeta'
          adb shell logcat -d -b crash > /tmp/crash.log
          if grep -F "Process: $pkg," /tmp/crash.log; then cat /tmp/crash.log; exit 1; fi
