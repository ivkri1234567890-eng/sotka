<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f4e46">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Приёмка">
<title>Приёмка квартиры</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
/* Field tool for apartment acceptance: calm green-grey palette, large touch targets, printable act. */
:root{--bg:#f3f4f1;--surface:#fff;--sunk:#eceee9;--ink:#1b1f1d;--muted:#66706b;--line:#dde1db;--acc:#1f4e46;--acc-ink:#fff;--ok:#2e7d4f;--ok-bg:#e3f2e8;--bad:#c2410c;--bad-bg:#fdeee4;--warn:#8a6d00;--warn-bg:#fdf6d8;--font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--mono:ui-monospace,"Roboto Mono",Consolas,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121514;--surface:#1b201e;--sunk:#232927;--ink:#e8ece9;--muted:#9aa49f;--line:#303834;--acc:#6fb5a6;--acc-ink:#0b1715;--ok:#6cc792;--ok-bg:#16301f;--bad:#ff8a5c;--bad-bg:#3a1f12;--warn:#e8c75a;--warn-bg:#352d10}}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--font);-webkit-tap-highlight-color:transparent}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:820px;margin:0 auto;padding:0 16px 96px}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:8px;padding:10px 16px;max-width:820px;margin:0 auto;border-bottom:1px solid var(--line)}
header.top h1{font-size:18px;margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
h2{font-size:18px;margin:18px 0 8px}h3{font-size:15px;margin:0 0 6px}
.muted{color:var(--muted)}.small{font-size:13px}.n{font-family:var(--mono);font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.btn{appearance:none;border:1px solid transparent;background:var(--acc);color:var(--acc-ink);font:600 15px var(--font);padding:10px 14px;border-radius:11px;min-height:44px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn.sec{background:var(--surface);color:var(--ink);border-color:var(--line)}.btn.ghost{background:transparent;color:var(--acc);border-color:transparent}.btn.bad{background:transparent;color:var(--bad);border-color:var(--line)}
.btn.sm{min-height:34px;padding:5px 10px;font-size:14px}.btn:disabled{opacity:.45}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.grow{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (max-width:420px){.grid3{grid-template-columns:1fr 1fr}}
label.f{display:block;font-size:13px;color:var(--muted)}label.f input,label.f select,label.f textarea{margin-top:3px}
input,select,textarea{font:16px var(--font);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:8px 10px;min-height:42px;width:100%;min-width:0}
textarea{min-height:64px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:0}
.rfin{display:flex;gap:6px}.rfin input{flex:1}.rfin .btn{flex:0 0 auto}
.list .it{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:12px;margin:8px 0;font:15px var(--font);cursor:pointer}
.badge{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.badge.bad{background:var(--bad-bg);color:var(--bad)}.badge.ok{background:var(--ok-bg);color:var(--ok)}.badge.warn{background:var(--warn-bg);color:var(--warn)}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:7px 12px;font:14px var(--font);cursor:pointer;min-height:36px}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none}.tabs .chip{flex:0 0 auto}
.check{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0}
.check.def{border-color:var(--bad);background:linear-gradient(var(--bad-bg),var(--bad-bg)) left/4px 100% no-repeat,var(--surface)}
.check.ok{background:linear-gradient(var(--ok),var(--ok)) left/4px 100% no-repeat,var(--surface)}
.check .t{font-weight:600}.check .norm{font-size:13px;color:var(--muted);margin:3px 0 8px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}.seg button{border:0;background:var(--surface);color:var(--ink);font:600 14px var(--font);padding:8px 12px;min-height:40px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}.seg button.on.ok{background:var(--ok);color:#fff}.seg button.on.def{background:var(--bad);color:#fff}.seg button.on.na{background:var(--muted);color:#fff}
.verdict{font-size:14px;margin-top:6px}.verdict.bad{color:var(--bad)}.verdict.ok{color:var(--ok)}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.thumbs img{width:74px;height:74px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:pointer}
.addph{width:74px;height:74px;border:1px dashed var(--muted);border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:26px;cursor:pointer;background:transparent}
.sec-title{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:16px 0 4px}
.warnbox{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:14px;margin:10px 0}
.rf{position:sticky;bottom:0;z-index:6;max-width:820px;margin:0 auto;background:var(--surface);border-top:1px solid var(--line);padding:8px 16px calc(8px + env(safe-area-inset-bottom));display:flex;gap:8px;align-items:center}
.rf .v{font:700 20px var(--mono)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:40;max-width:calc(100% - 32px);font-size:14px}
.modal{position:fixed;inset:0;z-index:30;background:#000;display:flex;flex-direction:column}
.modal .bar{display:flex;gap:6px;flex-wrap:wrap;padding:calc(8px + env(safe-area-inset-top)) 10px 8px;background:#111}
.modal .bar .chip{background:#222;color:#fff;border-color:#444}.modal .bar .chip.on{background:#fff;color:#111}
.modal .stage{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none}
.modal canvas{max-width:100%;max-height:100%;touch-action:none}
.sig{width:100%;height:120px;border:1px dashed var(--muted);border-radius:10px;background:#fff;touch-action:none;display:block}
.login{max-width:380px;margin:12vh auto 0;text-align:center}
.login .logo{width:72px;height:72px;border-radius:18px;margin:0 auto 12px;display:block}
table.t{width:100%;border-collapse:collapse;font-size:14px}table.t td,table.t th{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left;vertical-align:top}table.t th{font-size:12px;color:var(--muted)}
/* printable act */
.act{background:#fff;color:#111;font:12.5px/1.4 "Times New Roman",Times,serif;padding:18px;border-radius:6px;border:1px solid var(--line)}
.act h1{font-size:18px;text-align:center;margin:0 0 4px}.act .sub{text-align:center;margin-bottom:12px}
.act table{width:100%;border-collapse:collapse;margin:8px 0}.act td,.act th{border:1px solid #444;padding:4px 5px;vertical-align:top;text-align:left}.act th{background:#eee;font-weight:700}
.act .ph{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.act .ph figure{margin:0;break-inside:avoid}.act .ph img{width:100%;height:150px;object-fit:cover;border:1px solid #999}.act .ph figcaption{font-size:11px}
.act .signs{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px}.act .signs div{border-top:1px solid #333;padding-top:4px;min-height:70px}.act .signs img{height:56px;display:block}
.act a.phl{color:#1f4e46;text-decoration:underline;white-space:nowrap}.act tr[id],.act figure[id]{scroll-margin-top:72px}
.appx{break-before:page;page-break-before:always;margin-top:28px;border-top:2px dashed #999;padding-top:16px}.appx-h{text-align:right;font-size:12px;margin-bottom:6px}.appx-t{text-align:center;font-size:16px;margin:0 0 12px}
.appx figure{margin:0 0 16px;break-inside:avoid;page-break-inside:avoid}.appx img{display:block;width:100%;max-height:115mm;object-fit:contain;background:#f3f3f3;border:1px solid #999}.appx figcaption{font-size:12px;margin-top:5px}
.act .fix{color:#16723c;font-weight:700}.act .nofix{color:#b4320b;font-weight:700}
@media print{.appx{border-top:0;margin-top:0;padding-top:0}body{background:#fff;padding:0}header.top,.rf,.noprint,#toast{display:none!important}main{max-width:none;padding:0}.act{border:0;padding:0;border-radius:0}.act .ph img{height:130px}@page{size:A4;margin:14mm 12mm}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" hidden></div>

<script>
"use strict";
/* ============ basics ============ */
const BUNDLED_NORMS={"version":"2026.11.2","date":"2026-11-16","note":"Справочник норм «Приёмки квартиры». Пункты со статусом verified сверены с текстом документа; со статусом check — значение типовое, требуется сверка с действующей редакцией.","changes":["Добавлены минимальные требования к отделке объектов долевого строительства — приказ Минстроя России от 19.02.2025 № 91/пр (действует с 11.03.2025): стены, откосы, плитка, обои, плинтусы, полы, потолки, натяжные потолки. Сверено с официальным текстом.","Окна: отклонение от вертикали и горизонтали теперь по действующему ГОСТ 34378-2018 (прил. Л) — 1,5 мм на 1 пог. м, не более 3 мм на изделие. Сверено.","Новое: уклон подоконника — не более 1 % в сторону помещения, по длине — не более 0,5 % (ГОСТ 34378-2018, п. 7.3.2.2). Сверено.","Новое: отклонение готового пола от горизонтали/уклона — 0,2 % размера помещения, не более 10 мм; уступы между покрытием и окаймлением (стык покрытий) — не более 2 мм (СП 71, табл. 8.15). Сверено.","Новое: влажность стяжки перед полимерными покрытиями — не более 5 % (СП 71, табл. 8.9); влажность основания стен — не более 5 % по массе (СП 71, табл. 7.2). Сверено.","Новое (уточняется): температура воздуха, воздухообмен вытяжки, напряжение в сети, температура горячей воды, перепад температур на наружных стенах.","Входная дверь: значение 1,5 мм на 1 м / 3 мм подтверждено по ГОСТ 31173-2003 (прил. Е, п. Е.6); соответствие редакции 2016 г. уточняется."],"docs":{"sp71":{"title":"СП 71.13330.2017 «Изоляционные и отделочные покрытия» (актуализированная редакция СНиП 3.04.01-87)","url":"https://base.garant.ru/71729838/","remark":"Значения сверены с исходной редакцией 2017 г.; изменения № 1 и № 2 проверяются при ежемесячном обновлении."},"sp70":{"title":"СП 70.13330.2012 «Несущие и ограждающие конструкции» (актуализированная редакция СНиП 3.03.01-87)","url":"https://base.garant.ru/70353868/","remark":""},"gost30674":{"title":"ГОСТ 30674-99 «Блоки оконные из поливинилхлоридных профилей» (заменён ГОСТ 30674-2023 с 01.08.2024; монтаж — ГОСТ 30971-2012, ГОСТ 34378-2018)","url":"https://meganorm.ru/mega_doc/norm/gost_gosudarstvennyj-standart/0/gost_30674-2023_mezhgosudarstvennyy_standart_bloki_okonnye_i.html","remark":"Ссылки на пункты требуют перевода на действующие стандарты."},"gost31173":{"title":"ГОСТ 31173-2016 «Блоки дверные стальные» (значение по ГОСТ 31173-2003, прил. Е)","url":"","remark":""},"gost30971":{"title":"ГОСТ 30971-2012 «Швы монтажные узлов примыкания оконных блоков к стеновым проёмам»","url":"","remark":""},"sp30":{"title":"СП 30.13330.2020 «Внутренний водопровод и канализация зданий»","url":"","remark":""},"gost31311":{"title":"ГОСТ 31311-2005 «Приборы отопительные»","url":"","remark":""},"ddu":{"title":"Договор участия в долевом строительстве / проектная документация","url":"","remark":"Требования по договору и проекту."},"min91":{"title":"Приказ Минстроя России от 19.02.2025 № 91/пр «Об утверждении минимальных требований к результату производства отделочных работ на объекте долевого строительства»","url":"https://rg.ru/documents/2025/03/03/minstroi-prikaz91-site-dok.html","remark":"Действует с 11.03.2025 в течение 6 лет. Обязательный минимум для отделки по ДДУ; договор и стандарт застройщика не могут ухудшать эти требования."},"gost34378":{"title":"ГОСТ 34378-2018 «Конструкции ограждающие светопрозрачные. Окна и двери. Производство монтажных работ, контроль и требования к результатам работ»","url":"https://base.garant.ru/72204480/","remark":""},"gost30494":{"title":"ГОСТ 30494-2011 «Здания жилые и общественные. Параметры микроклимата в помещениях»","url":"","remark":""},"gost32144":{"title":"ГОСТ 32144-2013 «Нормы качества электрической энергии в системах электроснабжения общего назначения»","url":"","remark":""},"sanpin":{"title":"СанПиН 2.1.3684-21","url":"","remark":""},"sp50":{"title":"СП 50.13330.2012 «Тепловая защита зданий»","url":"","remark":""},"vent":{"title":"Нормы воздухообмена квартир (СП 54.13330 / СП 60.13330)","url":"","remark": async function sha256(s){if(crypto&&crypto.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}return sha256js(s)}

 hash=hash.slice(0,8);for(let j=0;j<words.length;){const w=words.slice(j,j+=16),oh=hash;hash=hash.slice(0,8);for(let i=0;i<64;i++){const w15=w[i-15],w2=w[i-2],a=hash[0],e=hash[4];const t1=hash[7]+(r(e,6)^r(e,11)^r(e,25))+((e&hash[5])^((~e)&hash[6]))+k[i]+(w[i]=(i<16)?w[i]:(w[i-16]+(r(w15,7)^r(w15,18)^(w15>>>3))+w[i-7]+(r(w2,17)^r(w2,19)^(w2>>>10)))|0);const t2=(r(a,2)^r(a,13)^r(a,22))+((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));hash=[(t1+t2)|0].concat(hash);hash[4]=(hash[4]+t1)|0}for(let i=0;i<8;i++)hash[i]=(hash[i]+oh[i])|0}

function normOf(o,key){if(!key)return null;let N=(o&&o.norms)||NORMS;if(!N||!N.norms[key])N=NORMS;return N&&N.norms[key]?{...N.norms[key],key,doc:N.docs[N.norms[key].doc]||{title:N.norms[key].doc}}:null}
function normRef(n){if(!n)return'';const d=n.doc||{};return(n.custom?'По договору / ТЗ: ':'')+(d.title?d.title.split(' «')[0]:'')+(n.clause?', '+n.clause:'')}
function stepVal(steps,x){if(x==null)return null;for(const[u,v]of steps)if(x<=u+1e-9)return v;return steps[steps.length-1][1]}
const BYNAME={height:'высоте помещения',diag:'диагонали',len:'длине'};
function limitText(n){const l=n&&n.limit;if(!l)return'визуально';if(l.t==='perM')return'≤ '+fmtN(l.perM)+' мм на 1 м'+(l.max!=null?', не более '+fmtN(l.max)+' мм':'');if(l.t==='max')return l.max===0?'не допускается':'≤ '+fmtN(l.max)+' мм';if(l.t==='pct')return fmtN(l.pct)+' % размера помещения, не более '+fmtN(l.max)+' мм';if(l.t==='range')return fmtN(l.min)+'–'+fmtN(l.max)+' мм';
 if(l.t==='step')return l.steps.map(([u,v],i)=>v+' мм'+(u<1e6?' (до '+fmtN(u)+' м)':'')).join(' / ')+' по '+BYNAME[l.by];if(l.t==='maxv')return'≤ '+fmtN(l.max)+' '+l.unit;if(l.t==='minv')return'≥ '+fmtN(l.min)+' '+l.unit;if(l.t==='rangev')return fmtN(l.min)+'–'+fmtN(l.max)+' '+l.unit;return''}
function snapshotNorms(){const N=JSON.parse(JSON.stringify(NORMS));for(const[k,ov]of Object.entries(DB.settings.overrides||{})){if(N.norms[k])N.norms[k]={...N.norms[k],limit:ov.limit,text:ov.text||N.norms[k].text,custom:true,reason:ov.reason||''}}return N}
const roomDiag=r=>{const a=num(r&&r.a),b=num(r&&r.b);return a&&b?Math.round(Math.hypot(a,b)*100)/100:null};
/* evaluate one norm against a measurement → {allowed, bad, text} */
function evaluate(n,m,v,room){if(!n||!n.limit||!v)return null;const l=n.limit,d=num(v.d);
 if(m==='diag'){const a=num(v.d1),b=num(v.d2);if(a==null||b==null)return null;const df=Math.round(Math.abs(a-b)*1000);return{allowed:null,bad:false,info:true,text:'Диагонали '+fmtN(a)+' и '+fmtN(b)+' м, разница '+df+' мм'}}
 if(d==null)return null;
 if(l.t==='perM'){const b=num(v.b)??1;let a=l.perM*b;if(l.max!=null)a=Math.min(a,l.max);a=Math.round(a*10)/10;return{allowed:a,bad:d>a+1e-9,text:(m==='mm'?'Замер ':'Отклонение ')+fmtN(d)+' мм на '+fmtN(b)+' м (допуск '+fmtN(a)+' мм)'}}
 if(l.t==='max')return{allowed:l.max,bad:d>l.max+1e-9,text:'Замер '+fmtN(d)+' мм (допуск '+(l.max===0?'0':fmtN(l.max))+' мм)'};
 if(l.t==='pct'){const sz=num(v.b)??roomDiag(room)??(room?Math.max(num(room.a)||0,num(room.b)||0):null);if(!sz)return null;const a=Math.round(Math.min(l.pct/100*sz*1000,l.max)*10)/10;return{allowed:a,bad:d>a+1e-9,text:'Перепад '+fmtN(d)+' мм на '+fmtN(sz)+' м (допуск '+fmtN(a)+' мм)'}}

function verdict(o,c,v,room){const basis=o.basis||'both',n1=basis==='min'&&c.norm2?null:normOf(o,c.norm),n2=basis==='sp'?null:normOf(o,c.norm2);

 return{n1,n2,e1,e2,bad:any?!!((e1&&e1.bad)||(e2&&e2.bad)):null,minBad:!!((e2&&e2.bad&&isMin(n2))||(e1&&e1.bad&&isMin(n1))),info:!!(any&&any.info)}}

function parseText(s){s=String(s).replace(/,/g,'.');const m=[...s.matchAll(/(\d+(?:\.\d+)?)\s*(mm|мм|cm|см|m|м)?/gi)];if(!m.length)return null;const x=m[m.length-1];let v=Number(x[1]);const u=(x[2]||'').toLowerCase();if(u==='mm'||u==='мм')v/=1000;else if(u==='cm'||u==='см')v/=100;else if(!u&&!x[1].includes('.')&&v>=50)v/=1000;return v>0.01&&v<300?Math.round(v*1000)/1000:null}
function rfFrame(b,meta){const proto=meta.proto||BLE.proto,chr=String(meta.chr||'').toLowerCase();
 if(b.length>=11&&b[0]===0xC0&&b[1]===0x55&&b[2]===0x10){const v=new DataView(new Uint8Array(b).buffer).getFloat32(7,true);if(v>0.02&&v<300)rfValue(Math.round(v*1000)/1000);return}

function measHTML(o,room,c,key,v){const n=normOf(o,c.norm)||normOf(o,c.norm2),l=n&&n.limit,I=(k,lab,rf,ph)=>`<label class="f">${lab}<input data-m="${key}" data-k="${k}" ${rf?`data-rf="${rf}"`:''} inputmode="decimal" value="${esc(v[k]??'')}" ${ph?`placeholder="${esc(ph)}"`:''}></label>`;
 if(c.m==='dev'){const st=l&&l.t==='step'&&l.by==='height',needB=!st||!(room&&num(room.h));return needB||!st?`<div class="grid2">${I('d','Отклонение, мм','mm')}${I('b',st?'Высота, м':l&&l.t==='step'&&l.by==='len'?'Длина откоса, м':l&&l.t==='perM'&&n.key==='min-ceil-sag'?'Диагональ, м':'На длине, м','m',st?'':l&&l.t==='perM'?'1':'')}</div>`:I('d','Отклонение на всю высоту, мм','mm')}

 if(c.m==='height'&&room){const hh=num(room.h),hp=num(room.hp);return`<div class="small">Факт: <b>${hh?fmt(hh,3)+' м':'не измерена'}</b>${hp?' · по проекту '+fmt(hp,2)+' м'+(hh?' · разница '+fmtN(Math.round((hh-hp)*1000))+' мм':''):''}</div>`}

function checkHTML(o,rid,room,c,it){const st=it.st||'',v=it.v||{},key=rid+'|'+c.id,V=verdict(o,c,v,room),both=V.n1&&V.n2;

const WALLS=['А','Б','В','Г'];
function roomSVG(o,room,pts,opt={}){const a=num(room.a)||4,b=num(room.b)||(num(room.a)||4)*0.8,W=opt.w||320,pad=34,k=Math.min((W-2*pad)/a,(W*0.9-2*pad)/b),w=a*k,h=b*k,H=h+2*pad;
 let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W*1.6}px;display:block;background:#fff;border-radius:8px" xmlns="http://www.w3.org/2000/svg" ${opt.tap?'data-tap="1"':''}><rect x="${pad}" y="${pad}" width="${w}" height="${h}" fill="#f4f2ec" stroke="#222" stroke-width="5"/>`;
 const zs=(room.zones||[]).filter(z=>z.cover&&num(z.share));if(zs.length>1){let x=pad;const tot=zs.reduce((q,z)=>q+num(z.share),0);zs.forEach((z,i)=>{const zw=w*num(z.share)/tot;s+=`<rect x="${x}" y="${pad}" width="${zw}" height="${h}" fill="${z.cover==='tile'?'url(#tl)':'#efe6d6'}" stroke="none" opacity=".9"/>`+(i?`<line x1="${x}" y1="${pad}" x2="${x}" y2="${pad+h}" stroke="#888" stroke-dasharray="4 3"/>`:'')+`<text x="${x+zw/2}" y="${pad+h-8}" font-size="11" text-anchor="middle" fill="#666">${COVER_SHORT[z.cover]}</text>`;x+=zw});s=s.replace('xmlns="http://www.w3.org/2000/svg"','xmlns="http://www.w3.org/2000/svg"><defs><pattern id="tl" width="14" height="14" patternUnits="userSpaceOnUse"><rect width="14" height="14" fill="#e8eef0"/><path d="M14 0V14H0" fill="none" stroke="#c5d0d4"/></pattern></defs');s+=`<rect x="${pad}" y="${pad}" width="${w}" height="${h}" fill="none" stroke="#222" stroke-width="5"/>`}
 const lab=(t,x,y)=>`<text x="${x}" y="${y}" font-size="13" font-weight="700" text-anchor="middle" fill="#1f4e46">${t}</text>`;
 s+=lab('стена '+WALLS[0]+(room.a?' · '+fmtN(num(room.a))+' м':''),pad+w/2,pad-10)+lab('стена '+WALLS[2],pad+w/2,pad+h+22)+`<text x="${pad-12}" y="${pad+h/2}" font-size="13" font-weight="700" fill="#1f4e46" text-anchor="middle" transform="rotate(-90 ${pad-12} ${pad+h/2})">стена ${WALLS[3]}</text><text x="${pad+w+16}" y="${pad+h/2}" font-size="13" font-weight="700" fill="#1f4e46" text-anchor="middle" transform="rotate(90 ${pad+w+16} ${pad+h/2})">стена ${WALLS[1]}${room.b?' · '+fmtN(num(room.b))+' м':''}</text>`;
 for(const p of pts){const x=pad+p.x*w,y=pad+p.y*h;s+=`<circle cx="${x}" cy="${y}" r="11" fill="${p.sel?'#c2410c':'#e11d1d'}" stroke="#fff" stroke-width="2"/><text x="${x}" y="${y+4}" font-size="11" font-weight="700" text-anchor="middle" fill="#fff">${esc(p.n)}</text>`}
 return s+`<rect data-plan="1" x="${pad-14}" y="${pad-14}" width="${w+28}" height="${h+28}" fill="transparent" ${opt.tap?'style="cursor:crosshair"':''} data-pad="${pad}" data-w="${w}" data-h="${h}"/></svg>`}
function ptWall(p){const d=[[p.y,0],[1-p.x,1],[1-p.y,2],[p.x,3]].sort((a,b)=>a[0]-b[0])[0];return d[0]<0.12?'у стены '+WALLS[d[1]]:'в центральной части'}
function openPin(key){const o=cur(),[rid,cid]=key.split('|'),room=roomById(o,rid),it=itemsOf(o,rid)[cid];const m=document.createElement('div');m.className='modal';
 const draw=()=>{const pts=[];const its=o.items[rid]||{};let n=0;for(const c of checklist(o,room)){const x=its[c.id];if(x&&x.st==='def'){n++;if(x.pt)pts.push({...x.pt,n:c.id===cid?'●':n,sel:c.id===cid})}}m.querySelector('.stage').innerHTML=`<div style="width:min(94vw,560px);background:#fff;padding:10px;border-radius:12px">${roomSVG(o,room,pts,{tap:1,w:360})}<p style="color:#333;font-size:14px;margin:8px 0 0">Нажмите место дефекта на схеме. Стена ${WALLS[0]} — вдоль длины помещения.</p></div>`};
 m.innerHTML=`<div class="bar"><span style="color:#fff;flex:1;align-self:center">Место дефекта на плане</span><button class="chip" data-t="clear">Убрать точку</button><button class="chip on" data-t="ok">Готово</button></div><div class="stage" style="touch-action:auto"></div>`;document.body.appendChild(m);draw();
 m.querySelector('.stage').addEventListener('click',e=>{const r=m.querySelector('[data-plan]');if(!r)return;const svg=r.ownerSVGElement,bb=svg.getBoundingClientRect(),vb=svg.viewBox.baseVal,sx=vb.width/bb.width,x=(e.clientX-bb.left)*sx,y=(e.clientY-bb.top)*sx,pad=+r.dataset.pad,w=+r.dataset.w,h=+r.dataset.h;
  const px=(x-pad)/w,py=(y-pad)/h;if(px<-.1||px>1.1||py<-.1||py>1.1)return;it.pt={x:Math.max(0,Math.min(1,px)),y:Math.max(0,Math.min(1,py))};if(!it.note){it.note=ptWall(it.pt)[0].toUpperCase()+ptWall(it.pt).slice(1)}save();draw()});
 m.querySelector('.bar').onclick=e=>{const b=e.target.closest('[data-t]');if(!b)return;if(b.dataset.t==='clear'){delete it.pt;save();draw()}else{m.remove();render()}}}

function conclusionDefault(o,D){if(o.parent){const nf=D.filter(d=>d.it.revisit!=='fixed').length;return nf?'Не устранено недостатков: '+nf+'. Требуется их устранение застройщиком в разумный срок.':'Все недостатки, выявленные при первичном осмотре, устранены.'}return D.length?'При осмотре выявлено недостатков: '+D.length+'. Участник долевого строительства требует их безвозмездного устранения застройщиком в разумный срок.':'Недостатков при осмотре не выявлено.'}

function mountSigs(){const o=cur();document.querySelectorAll('canvas[data-sig]').forEach(cv=>{const k=cv.dataset.sig,g=cv.getContext('2d');g.lineWidth=3;g.lineCap='round';g.strokeStyle='#123';let dn=false,last=null,dirty=false;
 const p=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height]};
 if(o.sign[k]){const im=new Image();im.onload=()=>g.drawImage(im,0,0,cv.width,cv.height);im.src=o.sign[k]}
 cv.onpointerdown=e=>{dn=true;last=p(e);cv.setPointerCapture(e.pointerId)};cv.onpointermove=e=>{if(!dn)return;const q=p(e);g.beginPath();g.moveTo(...last);g.lineTo(...q);g.stroke();last=q;dirty=true};
 cv.onpointerup=cv.onpointercancel=()=>{dn=false;if(dirty){o.sign[k]=cv.toDataURL('image/png');save();const im=document.querySelector('img[data-sigimg="'+k+'"]');if(im)im.src=o.sign[k]}}})}

/* ============ photos & markup ============ */
let photoKey=null;
async function addPhotoFiles(files){const o=cur();if(!o||!photoKey)return;const[rid,cid]=photoKey.split('|'),it=itemsOf(o,rid)[cid];if(!it)return;it.photos=it.photos||[];
 for(const f of files){const data=await downscale(f,1600);const id=uid();await PH.put({id,data});phCache.set(id,data);it.photos.push(id)}save();render();
 if(files.length===1)openMarkup(photoKey,it.photos.length-1)}
function downscale(file,max,type='image/jpeg'){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL(type,.82))};im.onerror=()=>rej(Error('не изображение'));im.src=fr.result};fr.onerror=()=>rej(fr.error);fr.readAsDataURL(file)})}
async function openMarkup(key,i){const o=cur(),[rid,cid]=key.split('|'),it=itemsOf(o,rid)[cid],id=it.photos[i],src=await phURL(id);if(!src)return;
 const m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="bar"><button class="chip on" data-t="arrow">Стрелка</button><button class="chip" data-t="ring">Круг</button><button class="chip" data-t="dim">Размер</button><button class="chip" data-t="text">Текст</button><button class="chip" data-t="undo">↶</button><span style="flex:1"></span><button class="chip" data-t="del">Удалить фото</button><button class="chip" data-t="cancel">Отмена</button><button class="chip on" data-t="save">Готово</button></div><div class="stage"><canvas></canvas></div>`;
 document.body.appendChild(m);const cv=m.querySelector('canvas'),g=cv.getContext('2d'),im=new Image(),shapes=[];let tool='arrow',drag=null;
 im.onload=()=>{cv.width=im.width;cv.height=im.height;draw()};im.src=src;
 const lw=()=>Math.max(4,cv.width/220);
 function arrow(a,b){const ang=Math.atan2(b[1]-a[1],b[0]-a[0]),hl=lw()*5;g.beginPath();g.moveTo(...a);g.lineTo(...b);g.stroke();g.beginPath();g.moveTo(...b);g.lineTo(b[0]-hl*Math.cos(ang-.45),b[1]-hl*Math.sin(ang-.45));g.lineTo(b[0]-hl*Math.cos(ang+.45),b[1]-hl*Math.sin(ang+.45));g.closePath();g.fill()}
 function label(t,x,y){const fs=lw()*6;g.font='bold '+fs+'px system-ui,sans-serif';const w=g.measureText(t).width;g.fillStyle='rgba(255,255,255,.9)';g.fillRect(x-6,y-fs,w+12,fs*1.3);g.fillStyle='#e11d1d';g.fillText(t,x,y)}
 function draw(){g.drawImage(im,0,0);g.strokeStyle=g.fillStyle='#e11d1d';g.lineWidth=lw();g.lineCap='round';
  for(const s of shapes.concat(drag?[drag]:[])){g.strokeStyle=g.fillStyle='#e11d1d';if(s.t==='arrow')arrow(s.a,s.b);else if(s.t==='ring'){g.beginPath();g.ellipse((s.a[0]+s.b[0])/2,(s.a[1]+s.b[1])/2,Math.abs(s.b[0]-s.a[0])/2+1,Math.abs(s.b[1]-s.a[1])/2+1,0,0,7);g.stroke()}
   else if(s.t==='dim'){arrow(s.a,s.b);arrow(s.b,s.a);if(s.txt)label(s.txt,(s.a[0]+s.b[0])/2,(s.a[1]+s.b[1])/2-lw()*2)}else if(s.t==='text')label(s.txt,s.a[0],s.a[1])}}
 const pt=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height]};
 cv.onpointerdown=e=>{cv.setPointerCapture(e.pointerId);const p=pt(e);if(tool==='text'){const t=prompt('Текст на фото','');if(t){shapes.push({t:'text',a:p,txt:t});draw()}return}drag={t:tool,a:p,b:p}};
 cv.onpointermove=e=>{if(!drag)return;drag.b=pt(e);draw()};
 cv.onpointerup=()=>{if(!drag)return;const d=drag;drag=null;if(Math.hypot(d.b[0]-d.a[0],d.b[1]-d.a[1])<8){draw();return}if(d.t==='dim'){d.txt=prompt('Размер (например «12 мм»)','')||''}shapes.push(d);draw()};
 m.querySelector('.bar').onclick=async e=>{const b=e.target.closest('[data-t]');if(!b)return;const t=b.dataset.t;
  if(['arrow','ring','dim','text'].includes(t)){tool=t;m.querySelectorAll('.bar [data-t]').forEach(x=>x.classList.toggle('on',x.dataset.t===t||x.dataset.t==='save'))}
  else if(t==='undo'){shapes.pop();draw()}else if(t==='cancel')m.remove();
  else if(t==='del'){if(!confirm('Удалить это фото?'))return;it.photos.splice(i,1);PH.del(id);save();m.remove();render()}
  else if(t==='save'){if(shapes.length){draw();const data=cv.toDataURL('image/jpeg',.85),nid=uid();await PH.put({id:nid,data,orig:id});phCache.set(nid,data);it.photos[i]=nid;save()}m.remove();render()}}}

async function shareText(name,text,mime='text/plain'){if(NATIVE&&NATIVE.shareText){NATIVE.shareText(name,text,mime);return}
 if(navigator.share&&mime==='text/plain'){try{await navigator.share({title:name,text});return}catch(e){if(e.name==='AbortError')return}}
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:mime}));a.download=name;document.body.appendChild(a);a.click();a.remove()}
async function backup(){const ids=new Set();DB.list.forEach(o=>Object.values(o.items).forEach(r=>Object.values(r).forEach(it=>(it.photos||[]).concat(it.prev&&it.prev.photos||[]).forEach(p=>ids.add(p)))));const photos={};for(const id of ids){const u=await phURL(id);if(u)photos[id]=u}
 await shareText('priemka-backup-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify({app:'priemka',v:1,db:DB,photos}),'application/json')}
async function restore(file){try{const d=JSON.parse(await file.text());if(d.app!=='priemka'||!d.db||!Array.isArray(d.db.list))throw Error('это не копия «Приёмки квартиры»');const have=new Set(DB.list.map(o=>o.id));let n=0;
 for(const o of d.db.list)if(!have.has(o.id)){DB.list.push(o);n++}for(const[id,data]of Object.entries(d.photos||{})){await PH.put({id,data});phCache.set(id,data)}save();toast('Добавлено приёмок: '+n);render()}catch(e){toast('Не удалось восстановить: '+e.message,4000)}}

document.addEventListener('submit',async e=>{if(e.target.id!=='loginF')return;e.preventDefault();const p=$('#pass').value.trim(),h=await sha256(PASS_SALT+p);
 if(h===PASS_HASH){LIC.mode='full';LIC.start=null;await licWrite();S.view='home';render();toast('Приложение активировано');updateNorms(false);return}
 if(h===TR_HASH&&S.view==='login'){if(LIC.mode==='trial'){if(trialLeft()>0){S.view='home';render();toast('Пробный период: осталось '+trialLeft()+' '+dayWord(trialLeft()))}else{S.view='locked';render()}return}
  LIC.mode='trial';LIC.start=Date.now();await licWrite();S.view='home';render();toast('Пробный период на '+TRIAL_DAYS+' дней начат');updateNorms(false);return}
 toast(S.view==='login'?'Неверный пароль':'Неверный код активации');$('#pass').value=''});
document.addEventListener('click',async e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,o=cur();
 if(a==='newobj'){const n=newInspection();S.id=n.id;S.view='obj';render()}
 else if(a==='open'){S.id=b.dataset.id;S.view='obj';render()}
 else if(a==='home'){S.view='home';render()}else if(a==='settings'){S.view='settings';render()}else if(a==='norms'){S.view='norms';render()}
 else if(a==='back'){S.view=S.view==='room'||S.view==='act'||S.view==='claim'?'obj':'home';render()}
 else if(a==='obj'){S.view='obj';render()}
 else if(a==='logo'){$('#logoIn').value='';$('#logoIn').click()}else if(a==='logodel'){delete DB.settings.logo;save();render()}
 else if(a==='setO'){o[b.dataset.k]=b.dataset.v;save();render()}
 else if(a==='addroom'){const t=b.dataset.t,n=o.rooms.filter(r=>r.type===t).length;const r={id:uid(),type:t,name:ROOM_TYPES[t].split(' /')[0]+(n?' '+(n+1):''),a:'',b:'',h:'',area:'',hp:''};o.rooms.push(r);save();S.room=r.id;S.view='room';render()}
 else if(a==='room'){S.room=b.dataset.id;S.view='room';render()}
 else if(a==='delroom'){if(!confirm('Удалить помещение и его замечания?'))return;o.rooms=o.rooms.filter(r=>r.id!==S.room);delete o.items[S.room];save();S.view='obj';render()}
 else if(a==='delobj'){if(!confirm('Удалить приёмку целиком? Это нельзя отменить.'))return;DB.list=DB.list.filter(x=>x.id!==o.id);save();S.view='home';render()}
 else if(a==='zones'){const r=roomById(o,S.room),c=r.cover||o.cover||'laminate';r.zones=[{cover:c==='tile'?'laminate':c,share:50},{cover:'tile',share:50}];save();render()}
 else if(a==='zadd'){const r=roomById(o,S.room);r.zones.push({cover:'laminate',share:''});save();render()}
 else if(a==='zdel'){const r=roomById(o,S.room);r.zones.splice(+b.dataset.i,1);if(r.zones.length<2){r.cover=(r.zones[0]||{}).cover||r.cover;r.zones=[]}save();render()}
 else if(a==='pin')openPin(b.dataset.key);
 else if(a==='pro'){o.pro=b.checked;save();render()}
 else if(a==='claim'){S.view='claim';render()}
 else if(a==='st'){const[rid,cid]=b.dataset.key.split('|'),its=itemsOf(o,rid),it=its[cid]=its[cid]||{};it.st=it.st===b.dataset.v?'':b.dataset.v;save();render()}
 else if(a==='rv'){const[rid,cid]=b.dataset.key.split('|'),it=itemsOf(o,rid)[cid];it.revisit=b.dataset.v;save();render()}
 else if(a==='allok'){const room=roomById(o,S.room),its=itemsOf(o,S.room);let n=0;for(const c of checklist(o,room)){const it=its[c.id]=its[c.id]||{};if(!it.st){it.st='ok';n++}}save();render();toast('Отмечено «норма»: '+n)}
 else if(a==='addphoto'||a==='addgal'){photoKey=b.dataset.key;const inp=$(a==='addphoto'?'#photoIn':'#photoGal');inp.value='';inp.click()}
 else if(a==='photo')openMarkup(b.dataset.key,+b.dataset.i);
 else if(a==='act'){S.view='act';render()}else if(a==='print')doPrint();
 else if(a==='sharetxt')shareText('Акт осмотра.txt',actText(o));
 else if(a==='sigclr'){delete o.sign[b.dataset.k];save();render()}
 else if(a==='revisit'){if(!defects(o).length){toast('В этой приёмке нет недостатков');return}const n=newInspection(o);n.date=today();save();S.id=n.id;S.view='obj';render();toast('Создан повторный осмотр: '+defects(n).length+' недостатков к проверке')}
 else if(a==='a2hs'){LS.set('pr:a2hs',true);render()}
 else if(a==='activate'){S.view='activate';render()}
 else if(a==='checknorms')updateNorms(true);else if(a==='normsDiffOk'){S.normsDiff=null;render()}
 else if(a==='override'){const k=b.dataset.k,n=NORMS.norms[k],l=n.limit;const cur0=DB.settings.overrides[k];const lim=JSON.parse(JSON.stringify((cur0||{}).limit||l));
  if(l.t==='perM'){const v=num(prompt('Свой допуск, мм на 1 м (по договору):',String(lim.perM).replace('.',',')));if(v==null)return;lim.perM=v;const mx=prompt('Не более, мм (пусто — без ограничения):',lim.max==null?'':String(lim.max).replace('.',','));lim.max=num(mx)}
  else if(l.t==='max'||l.t==='pct'){const v=num(prompt(l.t==='pct'?'Не более, мм:':'Свой допуск, мм (по договору):',String(lim.max).replace('.',',')));if(v==null)return;lim.max=v}
  const reason=prompt('Основание (например «п. 4.2 договора»):',(cur0||{}).reason||'')||'';DB.settings.overrides[k]={limit:lim,reason};save();render();toast('Свой допуск применится к новым приёмкам')}
 else if(a==='unoverride'){delete DB.settings.overrides[b.dataset.k];save();render()}
 else if(a==='backup')backup();else if(a==='restore'){$('#backupIn').value='';$('#backupIn').click()}
 else if(a==='rfon'){if(NATIVE){BLE.devices=[];BLE.state='connecting';rfBar();NATIVE.bleConnect()}}
 else if(a==='rfmeasure'){NATIVE&&NATIVE.bleMeasure()}else if(a==='rfoff'){BLE2&&BLE2.disconnect();BLE.state='off';rfBar()}
 else if(a==='rfpick'){if(BLE2){BLE.state='connecting';BLE.name=b.dataset.name;rfBar();BLE2.connect(b.dataset.addr,b.dataset.kind,b.dataset.name)}}});
document.addEventListener('change',e=>{const t=e.target,o=cur();
 if(t.id==='photoIn'||t.id==='photoGal'){if(t.files.length)addPhotoFiles([...t.files]).catch(err=>toast('Фото не добавлено: '+err.message));return}
 if(t.id==='logoIn'){if(t.files[0])downscale(t.files[0],500,'image/png').then(u=>{DB.settings.logo=u;save();render()}).catch(e=>toast('Логотип не загружен: '+e.message));return}
 if(t.dataset.c!=null){const o2=cur();o2.claim=o2.claim||{};o2.claim[t.dataset.c]=t.value.trim();save();render();return}
 if(t.id==='backupIn'){if(t.files[0])restore(t.files[0]);return}
 if(t.dataset.o!=null){o[t.dataset.o]=t.value.trim();save();if(t.dataset.o!=='conclusion')render();return}
 if(t.dataset.s!=null){DB.settings[t.dataset.s]=t.value.trim();save();return}
 if(t.dataset.r!=null){const r=roomById(o,S.room),k=t.dataset.r;let v=t.value.trim();if(['a','b','h','area','hp'].includes(k)&&v!==''){const n=num(v);if(n==null||n<=0||n>(k==='area'?1000:50)){toast('Введите размер в метрах, например 3,45');render();return}v=String(n)}r[k]=v;save();render();return}
 if(t.dataset.note!=null){const[rid,cid]=t.dataset.note.split('|');itemsOf(o,rid)[cid].note=t.value.trim();save();return}
 if(t.dataset.m!=null){const[rid,cid]=t.dataset.m.split('|'),its=itemsOf(o,rid),it=its[cid]=its[cid]||{};it.v=it.v||{};const v=t.value.trim();if(v===''){delete it.v[t.dataset.k]}else{const n=num(v);const isM=['b','d1','d2'].includes(t.dataset.k);if(n==null||n<-100||n>(isM?100:1000)){toast(isM?'Длина в метрах, например 2':'Введите число, например 4');t.value='';return}it.v[t.dataset.k]=n}
  const room=roomById(o,rid),c=checklist(o,room).find(x=>x.id===cid),V=verdict(o,c,it.v,room);if(V.bad!=null&&!V.info&&!it.revisit){const was=it.st;it.st=V.bad?'def':'ok';save();if(was!==it.st){render();return}}save();
  const el=document.getElementById('ev-'+t.dataset.m);if(el)el.innerHTML=verdictHTML(V);return}
 if(t.dataset.z!=null){const r=roomById(o,S.room),z=r.zones[+t.dataset.z];z[t.dataset.zk]=t.dataset.zk==='share'?(num(t.value)??''):t.value;save();render();return}});
window.appBack=()=>{if(document.querySelector('.modal')){document.querySelector('.modal').remove();return true}if(S.view==='room'||S.view==='act'||S.view==='claim'){S.view='obj';render();return true}if(S.view==='obj'||S.view==='settings'){S.view='home';render();return true}if(S.view==='norms'){S.view='settings';render();return true}return false};
