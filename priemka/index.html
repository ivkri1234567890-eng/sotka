<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f4e46">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Приёмка">
<title>Приёмка квартиры</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
/* Field tool for apartment acceptance: calm green-grey palette, large touch targets, printable act. */
:root{--bg:#f3f4f1;--surface:#fff;--sunk:#eceee9;--ink:#1b1f1d;--muted:#66706b;--line:#dde1db;--acc:#1f4e46;--acc-ink:#fff;--ok:#2e7d4f;--ok-bg:#e3f2e8;--bad:#c2410c;--bad-bg:#fdeee4;--warn:#8a6d00;--warn-bg:#fdf6d8;--font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--mono:ui-monospace,"Roboto Mono",Consolas,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121514;--surface:#1b201e;--sunk:#232927;--ink:#e8ece9;--muted:#9aa49f;--line:#303834;--acc:#6fb5a6;--acc-ink:#0b1715;--ok:#6cc792;--ok-bg:#16301f;--bad:#ff8a5c;--bad-bg:#3a1f12;--warn:#e8c75a;--warn-bg:#352d10}}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--font);-webkit-tap-highlight-color:transparent}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:820px;margin:0 auto;padding:0 16px 96px}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:8px;padding:10px 16px;max-width:820px;margin:0 auto;border-bottom:1px solid var(--line)}
header.top h1{font-size:18px;margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
h2{font-size:18px;margin:18px 0 8px}h3{font-size:15px;margin:0 0 6px}
.muted{color:var(--muted)}.small{font-size:13px}.n{font-family:var(--mono);font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.btn{appearance:none;border:1px solid transparent;background:var(--acc);color:var(--acc-ink);font:600 15px var(--font);padding:10px 14px;border-radius:11px;min-height:44px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn.sec{background:var(--surface);color:var(--ink);border-color:var(--line)}.btn.ghost{background:transparent;color:var(--acc);border-color:transparent}.btn.bad{background:transparent;color:var(--bad);border-color:var(--line)}
.btn.sm{min-height:34px;padding:5px 10px;font-size:14px}.btn:disabled{opacity:.45}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.grow{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (max-width:420px){.grid3{grid-template-columns:1fr 1fr}}
label.f{display:block;font-size:13px;color:var(--muted)}label.f input,label.f select,label.f textarea{margin-top:3px}
input,select,textarea{font:16px var(--font);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:8px 10px;min-height:42px;width:100%;min-width:0}
textarea{min-height:64px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:0}
.rfin{display:flex;gap:6px}.rfin input{flex:1}.rfin .btn{flex:0 0 auto}
.list .it{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:12px;margin:8px 0;font:15px var(--font);cursor:pointer}
.badge{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.badge.bad{background:var(--bad-bg);color:var(--bad)}.badge.ok{background:var(--ok-bg);color:var(--ok)}.badge.warn{background:var(--warn-bg);color:var(--warn)}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:7px 12px;font:14px var(--font);cursor:pointer;min-height:36px}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none}.tabs .chip{flex:0 0 auto}
.check{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0}
.check.def{border-color:var(--bad);background:linear-gradient(var(--bad-bg),var(--bad-bg)) left/4px 100% no-repeat,var(--surface)}
.check.ok{background:linear-gradient(var(--ok),var(--ok)) left/4px 100% no-repeat,var(--surface)}
.check .t{font-weight:600}.check .norm{font-size:13px;color:var(--muted);margin:3px 0 8px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}.seg button{border:0;background:var(--surface);color:var(--ink);font:600 14px var(--font);padding:8px 12px;min-height:40px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}.seg button.on.ok{background:var(--ok);color:#fff}.seg button.on.def{background:var(--bad);color:#fff}.seg button.on.na{background:var(--muted);color:#fff}
.verdict{font-size:14px;margin-top:6px}.verdict.bad{color:var(--bad)}.verdict.ok{color:var(--ok)}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.thumbs img{width:74px;height:74px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:pointer}
.addph{width:74px;height:74px;border:1px dashed var(--muted);border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:26px;cursor:pointer;background:transparent}
.sec-title{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:16px 0 4px}
.warnbox{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:14px;margin:10px 0}
.rf{position:sticky;bottom:0;z-index:6;max-width:820px;margin:0 auto;background:var(--surface);border-top:1px solid var(--line);padding:8px 16px calc(8px + env(safe-area-inset-bottom));display:flex;gap:8px;align-items:center}
.rf .v{font:700 20px var(--mono)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:40;max-width:calc(100% - 32px);font-size:14px}
.modal{position:fixed;inset:0;z-index:30;background:#000;display:flex;flex-direction:column}
.modal .bar{display:flex;gap:6px;flex-wrap:wrap;padding:calc(8px + env(safe-area-inset-top)) 10px 8px;background:#111}
.modal .bar .chip{background:#222;color:#fff;border-color:#444}.modal .bar .chip.on{background:#fff;color:#111}
.modal .stage{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none}
.modal canvas{max-width:100%;max-height:100%;touch-action:none}
.sig{width:100%;height:120px;border:1px dashed var(--muted);border-radius:10px;background:#fff;touch-action:none;display:block}
.login{max-width:380px;margin:12vh auto 0;text-align:center}
.login .logo{width:72px;height:72px;border-radius:18px;margin:0 auto 12px;display:block}
table.t{width:100%;border-collapse:collapse;font-size:14px}table.t td,table.t th{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left;vertical-align:top}table.t th{font-size:12px;color:var(--muted)}
/* printable act */
.act{background:#fff;color:#111;font:12.5px/1.4 "Times New Roman",Times,serif;padding:18px;border-radius:6px;border:1px solid var(--line)}
.act h1{font-size:18px;text-align:center;margin:0 0 4px}.act .sub{text-align:center;margin-bottom:12px}
.act table{width:100%;border-collapse:collapse;margin:8px 0}.act td,.act th{border:1px solid #444;padding:4px 5px;vertical-align:top;text-align:left}.act th{background:#eee;font-weight:700}
.act .ph{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.act .ph figure{margin:0;break-inside:avoid}.act .ph img{width:100%;height:150px;object-fit:cover;border:1px solid #999}.act .ph figcaption{font-size:11px}
.act .signs{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px}.act .signs div{border-top:1px solid #333;padding-top:4px;min-height:70px}.act .signs img{height:56px;display:block}
.act .fix{color:#16723c;font-weight:700}.act .nofix{color:#b4320b;font-weight:700}
@media print{body{background:#fff;padding:0}header.top,.rf,.noprint,#toast{display:none!important}main{max-width:none;padding:0}.act{border:0;padding:0;border-radius:0}.act .ph img{height:130px}@page{size:A4;margin:14mm 12mm}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" hidden></div>
<input type="file" id="photoIn" accept="image/*" capture="environment" hidden>
<input type="file" id="photoGal" accept="image/*" multiple hidden>
<input type="file" id="backupIn" accept="application/json,.json" hidden>
<script>
"use strict";
/* ============ basics ============ */
const BUNDLED_NORMS={"version":"2026.11.1","date":"2026-11-15","note":"Справочник норм «Приёмки квартиры». Пункты со статусом verified сверены с текстом документа; со статусом check — значение типовое, требуется сверка с действующей редакцией.","changes":["Первая редакция справочника."],"docs":{"sp71":{"title":"СП 71.13330.2017 «Изоляционные и отделочные покрытия» (актуализированная редакция СНиП 3.04.01-87)","url":"https://base.garant.ru/71729838/","remark":"Значения сверены с исходной редакцией 2017 г.; изменения № 1 и № 2 проверяются при ежемесячном обновлении."},"sp70":{"title":"СП 70.13330.2012 «Несущие и ограждающие конструкции» (актуализированная редакция СНиП 3.03.01-87)","url":"https://base.garant.ru/70353868/","remark":""},"gost30674":{"title":"ГОСТ 30674-99 «Блоки оконные из поливинилхлоридных профилей» (заменён ГОСТ 30674-2023 с 01.08.2024; монтаж — ГОСТ 30971-2012, ГОСТ 34378-2018)","url":"https://meganorm.ru/mega_doc/norm/gost_gosudarstvennyj-standart/0/gost_30674-2023_mezhgosudarstvennyy_standart_bloki_okonnye_i.html","remark":"Ссылки на пункты требуют перевода на действующие стандарты."},"gost31173":{"title":"ГОСТ 31173-2016 «Блоки дверные стальные»","url":"","remark":""},"gost30971":{"title":"ГОСТ 30971-2012 «Швы монтажные узлов примыкания оконных блоков к стеновым проёмам»","url":"","remark":""},"sp30":{"title":"СП 30.13330.2020 «Внутренний водопровод и канализация зданий»","url":"","remark":""},"gost31311":{"title":"ГОСТ 31311-2005 «Приборы отопительные»","url":"","remark":""},"ddu":{"title":"Договор участия в долевом строительстве / проектная документация","url":"","remark":"Требования по договору и проекту."}},"norms":{"plaster-vert-simple":{"doc":"sp71","clause":"табл. 7.4 (простая штукатурка)","text":"Отклонение от вертикали — не более 3 мм на 1 м, но не более 10 мм на всю высоту помещения","limit":{"t":"perM","perM":3,"max":10},"status":"verified"},"plaster-vert-improved":{"doc":"sp71","clause":"табл. 7.4 (улучшенная штукатурка)","text":"Отклонение от вертикали — не более 2 мм на 1 м, но не более 10 мм на всю высоту помещения","limit":{"t":"perM","perM":2,"max":10},"status":"verified"},"plaster-vert-high":{"doc":"sp71","clause":"табл. 7.4 (высококачественная штукатурка)","text":"Отклонение от вертикали — не более 0,5 мм на 1 м, но не более 5 мм на всю высоту помещения","limit":{"t":"perM","perM":0.5,"max":5},"status":"verified"},"plaster-hor-simple":{"doc":"sp71","clause":"табл. 7.4 (простая штукатурка)","text":"Отклонение по горизонтали — не более 3 мм на 1 м","limit":{"t":"perM","perM":3,"max":null},"status":"verified"},"plaster-hor-improved":{"doc":"sp71","clause":"табл. 7.4 (улучшенная штукатурка)","text":"Отклонение по горизонтали — не более 3 мм на 1 м","limit":{"t":"perM","perM":3,"max":null},"status":"verified"},"plaster-hor-high":{"doc":"sp71","clause":"табл. 7.4 (высококачественная штукатурка)","text":"Отклонение по горизонтали — не более 1 мм на 1 м","limit":{"t":"perM","perM":1,"max":null},"status":"verified"},"plaster-flat-simple":{"doc":"sp71","clause":"табл. 7.4 (простая штукатурка)","text":"Неровности поверхности плавного очертания — не более 4 мм на 1 м, но не более 10 мм на весь элемент","limit":{"t":"perM","perM":4,"max":10},"status":"verified"},"plaster-flat-improved":{"doc":"sp71","clause":"табл. 7.4 (улучшенная штукатурка)","text":"Неровности поверхности плавного очертания — не более 2 шт. глубиной (высотой) до 3 мм","limit":{"t":"max","max":3},"status":"verified"},"plaster-flat-high":{"doc":"sp71","clause":"табл. 7.4 (высококачественная штукатурка)","text":"Неровности поверхности плавного очертания — не более 2 шт. глубиной (высотой) до 1 мм","limit":{"t":"max","max":1},"status":"verified"},"plaster-slope-simple":{"doc":"sp71","clause":"табл. 7.4 (простая штукатурка)","text":"Отклонение откосов, пилястр, столбов — не более 4 мм на 1 м, но не более 10 мм на весь элемент; ширина откоса — не более 5 мм","limit":{"t":"perM","perM":4,"max":10},"status":"verified"},"plaster-slope-improved":{"doc":"sp71","clause":"табл. 7.4 (улучшенная штукатурка)","text":"Отклонение откосов, пилястр, столбов — не более 4 мм на 1 м, но не более 10 мм на весь элемент; ширина откоса — не более 3 мм","limit":{"t":"perM","perM":4,"max":10},"status":"verified"},"plaster-slope-high":{"doc":"sp71","clause":"табл. 7.4 (высококачественная штукатурка)","text":"Отклонение откосов, пилястр, столбов — не более 2 мм на 1 м, но не более 5 мм на весь элемент; ширина откоса — не более 2 мм","limit":{"t":"perM","perM":2,"max":5},"status":"verified"},"wallpaper":{"doc":"sp71","clause":"п. 7.6.15","text":"Не допускаются пузыри, замятины, пятна, доклейки и отслоения обоев","limit":null,"status":"verified"},"wallpaper-joints":{"doc":"sp71","clause":"пп. 7.6.9–7.6.11","text":"Полосы клеят встык; во внутренних и внешних углах — перекрытие 10–20 мм","limit":null,"status":"verified"},"tile-wall-vert":{"doc":"sp71","clause":"табл. 7.6 (внутренняя облицовка керамикой)","text":"Отклонение облицованной поверхности от вертикали — не более 1,5 мм на 1 м (не более 4 мм на этаж)","limit":{"t":"perM","perM":1.5,"max":4},"status":"verified"},"tile-wall-joints":{"doc":"sp71","clause":"табл. 7.6, п. 7.4.13","text":"Отклонение расположения швов от вертикали и горизонтали — не более 1,5 мм на 1 м; швы ровные, одинаковой ширины","limit":{"t":"perM","perM":1.5,"max":null},"status":"verified"},"tile-wall-flat":{"doc":"sp71","clause":"табл. 7.6 (внутренняя облицовка керамикой)","text":"Неровности плоскости облицовки при контроле двухметровой рейкой — не более 2 мм","limit":{"t":"max","max":2},"status":"check"},"ceiling-panels":{"doc":"sp71","clause":"табл. 7.8","text":"Подвесные потолки и облицовка плитами: уступы — не более 2 мм, отклонение плоскости — не более 1,5 мм на 1 м, отклонение стыка от вертикали — не более 1 мм на 1 м","limit":{"t":"perM","perM":1.5,"max":null},"status":"verified"},"screed-flat-thin":{"doc":"sp71","clause":"табл. 8.5","text":"Просвет между двухметровой рейкой и стяжкой под линолеу /* evaluate a measurement → {allowed, bad, text} */
function evaluate(n,m,v,room){if(!n||!n.limit||!v)return null;const l=n.limit;
 if(m==='dev'&&l.t==='perM'){const d=num(v.d),b=num(v.b)??1;if(d==null)return null;let a=l.perM*b;if(l.max!=null)a=Math.min(a,l.max);return{allowed:a,bad:d>a+1e-9,text:'Отклонение '+fmtN(d)+' мм на '+fmtN(b)+' м (допуск '+fmtN(a)+' мм)'}}
 if((m==='mm'||m==='dev')&&l.t==='max'){const d=num(v.d);if(d==null)return null;return{allowed:l.max,bad:d>l.max+1e-9,text:'Замер '+fmtN(d)+' мм (допуск '+(l.max===0?'0':fmtN(l.max))+' мм)'}}
 if(m==='mm'&&l.t==='perM'){const d=num(v.d),b=num(v.b)??1;if(d==null)return null;let a=l.perM*b;if(l.max!=null)a=Math.min(a,l.max);return{allowed:a,bad:d>a+1e-9,text:'Отклонение '+fmtN(d)+' мм на '+fmtN(b)+' м (допуск '+fmtN(a)+' мм)'}}
 if(m==='pct'&&l.t==='pct'){const d=num(v.d),sz=num(v.b)??(room?Math.max(num(room.a)||0,num(room.b)||0):null);if(d==null||!sz)return null;const a=Math.min(l.pct/100*sz*1000,l.max);return{allowed:a,bad:d>a+1e-9,text:'Перепад '+fmtN(d)+' мм на '+fmtN(sz)+' м (допуск '+fmtN(Math.round(a*10)/10)+' мм)'}}
 if(m==='range'&&l.t==='range'){const d=num(v.d);if(d==null)return null;return{allowed:null,bad:d<l.min||d>l.max,text:'Замер '+fmtN(d)+' мм (норма '+fmtN(l.min)+'–'+fmtN(l.max)+' мм)'}}
 return null}
async function updateNorms(manual){try{const r=await fetch(NORMS_URL+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const N=await r.json();if(!N||!N.norms||!N.version)throw Error('неверный файл');
  if(!NORMS||cmpVer(N.version,NORMS.version)>0){const old=NORMS;NORMS=N;LS.set('pr:norms',N);S.normsDiff=diffNorms(old,N);toast('Справочник норм обновлён до версии '+N.version,4000);render()}else if(manual)toast('Нормы актуальны: версия '+NORMS.version)}catch(e){if(manual)toast('Не удалось проверить обновления: '+e.message)}}
function diffNorms(a,b){const out=[];if(!a)return out;for(const[k,n]of Object.entries(b.norms)){const o=a.norms[k];if(!o)out.push('Новый пункт: '+n.text);else if(JSON.stringify(o.limit)!==JSON.stringify(n.limit)||o.text!==n.text||o.clause!==n.clause)out.push('Изменено: '+n.text+' (было: '+o.text+')')}for(const k of Object.keys(a.norms))if(!b.norms[k])out.push('Исключено: '+a.norms[k].text);return out}

function itemsOf(o,rid){const k=rid||'flat';o.items[k]=o.items[k]||{};return o.items[k]}
function roomById(o,rid){return rid==='flat'?null:o.rooms.find(r=>r.id===rid)}
function roomArea(r){const m=num(r.area);if(m)return m;const a=num(r.a),b=num(r.b);return a&&b?Math.round(a*b*100)/100:null}
function totalArea(o){let s=0;for(const r of o.rooms){const a=roomArea(r);if(a)s+=r.type==='balcony'?a*(num(o.balK)??0.3):a}return Math.round(s*100)/100}
function defects(o){const out=[];const scan=(rid,room)=>{for(const c of checklist(o,room)){const it=(o.items[rid]||{})[c.id];if(it&&it.st==='def')out.push({rid,room,c,it})}};scan('flat',null);o.rooms.forEach(r=>scan(r.id,r));return out}
function stats(o){let tot=0,done=0,def=0;const scan=(rid,room)=>{for(const c of checklist(o,room)){tot++;const it=(o.items[rid]||{})[c.id];if(it&&it.st){done++;if(it.st==='def')def++}}};scan('flat',null);o.rooms.forEach(r=>scan(r.id,r));return{tot,done,def}}

const BLE={state:'off',name:'',devices:[],proto:'',buf:'',bufT:null,last:null,lastT:0};
let rfTarget=null;
document.addEventListener('focusin',e=>{if(e.target.matches&&e.target.matches('input[data-rf]'))rfTarget=e.target});
function rfValue(m){const t=Date.now();if(BLE.last===m&&t-BLE.lastT<500)return;BLE.last=m;BLE.lastT=t;const el=rfTarget&&document.body.contains(rfTarget)?rfTarget:document.querySelector('input[data-rf]');const v=$('#rfv');if(v)v.textContent=fmt(m,3)+' м';
 if(!el){toast('Замер '+fmt(m,3)+' м — нажмите на поле, куда его записать');return}
 const unit=el.dataset.rf;el.value=unit==='mm'?String(Math.round(m*1000)):String(m).replace('.',',');el.dispatchEvent(new Event('change',{bubbles:true}));toast('Записано: '+(unit==='mm'?Math.round(m*1000)+' мм':fmt(m,3)+' м'))}
function parseText(s){s=String(s).replace(/,/g,'.');const m=[...s.matchAll(/(\d+(?:\.\d+)?)\s*(mm|мм|cm|см|m|м)?/gi)];if(!m.length)return null;const x=m[m.length-1];let v=Number(x[1]);const u=(x[2]||'').toLowerCase();if(u==='mm'||u==='мм')v/=1000;else if(u==='cm'||u==='см')v/=100;else if(!u&&!x[1].includes('.')&&v>=50)v/=1000;return v>0.01&&v<300?Math.round(v*1000)/1000:null}
function rfFrame(b,meta){const proto=meta.proto||BLE.proto,chr=String(meta.chr||'').toLowerCase();
 if(b.length>=11&&b[0]===0xC0&&b[1]===0x55&&b[2]===0x10){const v=new DataView(new Uint8Array(b).buffer).getFloat32(7,true);if(v>0.02&&v<300)rfValue(Math.round(v*1000)/1000);return}
 if(proto==='leica'&&chr.startsWith('3ab10101')&&b.length>=4){const v=new DataView(new Uint8Array(b).buffer).getFloat32(0,true);if(v>0.01&&v<300)rfValue(Math.round(v*1000)/1000);return}
 if(b.length&&b.every(x=>x===9||x===10||x===13||x>=32&&x<127)){BLE.buf+=String.fromCharCode(...b);clearTimeout(BLE.bufT);const fl=()=>{const v=parseText(BLE.buf);BLE.buf='';if(v)rfValue(v)};if(/[\r\n]/.test(BLE.buf))fl();else BLE.bufT=setTimeout(fl,200)}}
window.glmEvent=e=>{if(e.type==='device'){const i=BLE.devices.findIndex(d=>d.addr===e.addr);if(i>=0)BLE.devices[i]={...BLE.devices[i],...e};else BLE.devices.push(e);rfBar()}
 else if(e.type==='status'){BLE.state=e.state;BLE.name=e.name||BLE.name;if(e.proto!==undefined)BLE.proto=e.proto;if(e.text)toast(e.text);rfBar()}
 else if(e.type==='info')toast(e.text);else if(e.type==='frame')rfFrame((e.hex.match(/../g)||[]).map(h=>parseInt(h,16)),e)};
function rfBar(){const el=$('#rfbar');if(!el)return;el.outerHTML=rfBarHTML();}
function rfBarHTML(){if(!NATIVE)return`<div class="rf noprint" id="rfbar"><span class="small muted grow">Дальномер: в приложении для Android — по Bluetooth. Здесь вводите размеры вручную.</span></div>`;
 const s=BLE.state,devs=BLE.devices.slice().sort((a,b)=>(b.proto?1:0)-(a.proto?1:0)||(b.rssi||-999)-(a.rssi||-999));
 return`<div class="rf noprint" id="rfbar"><div class="grow"><div class="small muted">${s==='on'?'Дальномер: '+esc(BLE.name):s==='connecting'?'Поиск дальномера…':'Дальномер не подключён'}</div><div class="v" id="rfv">${BLE.last?fmt(BLE.last,3)+' м':'—'}</div>
 ${s!=='on'&&devs.length?`<div class="chips" style="margin-top:4px">${devs.slice(0,6).map(d=>`<button class="chip" data-a="rfpick" data-addr="${esc(d.addr)}" data-kind="${esc(d.kind)}" data-name="${esc(d.name||'')}">${d.proto?'★ ':''}${esc(d.name||d.addr)}</button>`).join('')}</div>`:''}</div>
 ${s==='on'?`<button class="btn sm" data-a="rfmeasure">Замер</button><button class="btn sec sm" data-a="rfoff">Откл.</button>`:`<button class="btn sm" data-a="rfon">Подключить</button>`}</div>`}

/* ============ signatures ============ */
function mountSigs(){const o=cur();document.querySelectorAll('canvas[data-sig]').forEach(cv=>{const k=cv.dataset.sig,g=cv.getContext('2d');g.lineWidth=3;g.lineCap='round';g.strokeStyle='#123';let dn=false,last=null,dirty=false;
 const p=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height]};
 if(o.sign[k]){const im=new Image();im.onload=()=>g.drawImage(im,0,0,cv.width,cv.height);im.src=o.sign[k]}
 cv.onpointerdown=e=>{dn=true;last=p(e);cv.setPointerCapture(e.pointerId)};cv.onpointermove=e=>{if(!dn)return;const q=p(e);g.beginPath();g.moveTo(...last);g.lineTo(...q);g.stroke();last=q;dirty=true};
 cv.onpointerup=cv.onpointercancel=()=>{dn=false;if(dirty){o.sign[k]=cv.toDataURL('image/png');save();const im=document.querySelector('img[data-sigimg="'+k+'"]');if(im)im.src=o.sign[k]}}})}

/* ============ photos & markup ============ */
let photoKey=null;
async function addPhotoFiles(files){const o=cur();if(!o||!photoKey)return;const[rid,cid]=photoKey.split('|'),it=itemsOf(o,rid)[cid];if(!it)return;it.photos=it.photos||[];
 for(const f of files){const data=await downscale(f,1600);const id=uid();await PH.put({id,data});phCache.set(id,data);it.photos.push(id)}save();render();
 if(files.length===1)openMarkup(photoKey,it.photos.length-1)}
function downscale(file,max){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.82))};im.onerror=()=>rej(Error('не изображение'));im.src=fr.result};fr.onerror=()=>rej(fr.error);fr.readAsDataURL(file)})}
async function openMarkup(key,i){const o=cur(),[rid,cid]=key.split('|'),it=itemsOf(o,rid)[cid],id=it.photos[i],src=await phURL(id);if(!src)return;
 const m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="bar"><button class="chip on" data-t="arrow">Стрелка</button><button class="chip" data-t="ring">Круг</button><button class="chip" data-t="dim">Размер</button><button class="chip" data-t="text">Текст</button><button class="chip" data-t="undo">↶</button><span style="flex:1"></span><button class="chip" data-t="del">Удалить фото</button><button class="chip" data-t="cancel">Отмена</button><button class="chip on" data-t="save">Готово</button></div><div class="stage"><canvas></canvas></div>`;
 document.body.appendChild(m);const cv=m.querySelector('canvas'),g=cv.getContext('2d'),im=new Image(),shapes=[];let tool='arrow',drag=null;
 im.onload=()=>{cv.width=im.width;cv.height=im.height;draw()};im.src=src;
 const lw=()=>Math.max(4,cv.width/220);
 function arrow(a,b){const ang=Math.atan2(b[1]-a[1],b[0]-a[0]),hl=lw()*5;g.beginPath();g.moveTo(...a);g.lineTo(...b);g.stroke();g.beginPath();g.moveTo(...b);g.lineTo(b[0]-hl*Math.cos(ang-.45),b[1]-hl*Math.sin(ang-.45));g.lineTo(b[0]-hl*Math.cos(ang+.45),b[1]-hl*Math.sin(ang+.45));g.closePath();g.fill()}
 function label(t,x,y){const fs=lw()*6;g.font='bold '+fs+'px system-ui,sans-serif';const w=g.measureText(t).width;g.fillStyle='rgba(255,255,255,.9)';g.fillRect(x-6,y-fs,w+12,fs*1.3);g.fillStyle='#e11d1d';g.fillText(t,x,y)}
 function draw(){g.drawImage(im,0,0);g.strokeStyle=g.fillStyle='#e11d1d';g.lineWidth=lw();g.lineCap='round';
  for(const s of shapes.concat(drag?[drag]:[])){g.strokeStyle=g.fillStyle='#e11d1d';if(s.t==='arrow')arrow(s.a,s.b);else if(s.t==='ring'){g.beginPath();g.ellipse((s.a[0]+s.b[0])/2,(s.a[1]+s.b[1])/2,Math.abs(s.b[0]-s.a[0])/2+1,Math.abs(s.b[1]-s.a[1])/2+1,0,0,7);g.stroke()}
   else if(s.t==='dim'){arrow(s.a,s.b);arrow(s.b,s.a);if(s.txt)label(s.txt,(s.a[0]+s.b[0])/2,(s.a[1]+s.b[1])/2-lw()*2)}else if(s.t==='text')label(s.txt,s.a[0],s.a[1])}}
 const pt=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height]};
 cv.onpointerdown=e=>{cv.setPointerCapture(e.pointerId);const p=pt(e);if(tool==='text'){const t=prompt('Текст на фото','');if(t){shapes.push({t:'text',a:p,txt:t});draw()}return}drag={t:tool,a:p,b:p}};
 cv.onpointermove=e=>{if(!drag)return;drag.b=pt(e);draw()};
 cv.onpointerup=()=>{if(!drag)return;const d=drag;drag=null;if(Math.hypot(d.b[0]-d.a[0],d.b[1]-d.a[1])<8){draw();return}if(d.t==='dim'){d.txt=prompt('Размер (например «12 мм»)','')||''}shapes.push(d);draw()};
 m.querySelector('.bar').onclick=async e=>{const b=e.target.closest('[data-t]');if(!b)return;const t=b.dataset.t;
  if(['arrow','ring','dim','text'].includes(t)){tool=t;m.querySelectorAll('.bar [data-t]').forEach(x=>x.classList.toggle('on',x.dataset.t===t||x.dataset.t==='save'))}
  else if(t==='undo'){shapes.pop();draw()}else if(t==='cancel')m.remove();
  else if(t==='del'){if(!confirm('Удалить это фото?'))return;it.photos.splice(i,1);PH.del(id);save();m.remove();render()}
  else if(t==='save'){if(shapes.length){draw();const data=cv.toDataURL('image/jpeg',.85),nid=uid();await PH.put({id:nid,data,orig:id});phCache.set(nid,data);it.photos[i]=nid;save()}m.remove();render()}}}

 else if(a==='room'){S.room=b.dataset.id;S.view='room';render()}
 else if(a==='delroom'){if(!confirm('Удалить помещение и его замечания?'))return;o.rooms=o.rooms.filter(r=>r.id!==S.room);delete o.items[S.room];save();S.view='obj';render()}
 else if(a==='delobj'){if(!confirm('Удалить приёмку целиком? Это нельзя отменить.'))return;DB.list=DB.list.filter(x=>x.id!==o.id);save();S.view='home';render()}
 else if(a==='st'){const[rid,cid]=b.dataset.key.split('|'),its=itemsOf(o,rid),it=its[cid]=its[cid]||{};it.st=it.st===b.dataset.v?'':b.dataset.v;save();render()}
 else if(a==='rv'){const[rid,cid]=b.dataset.key.split('|'),it=itemsOf(o,rid)[cid];it.revisit=b.dataset.v;save();render()}
 else if(a==='allok'){const room=roomById(o,S.room),its=itemsOf(o,S.room);let n=0;for(const c of checklist(o,room)){const it=its[c.id]=its[c.id]||{};if(!it.st){it.st='ok';n++}}save();render();toast('Отмечено «норма»: '+n)}
 else if(a==='addphoto'||a==='addgal'){photoKey=b.dataset.key;const inp=$(a==='addphoto'?'#photoIn':'#photoGal');inp.value='';inp.click()}
 else if(a==='photo')openMarkup(b.dataset.key,+b.dataset.i);
 else if(a==='act'){S.view='act';render()}else if(a==='print')doPrint();
 else if(a==='sharetxt')shareText('Акт осмотра.txt',actText(o));
 else if(a==='sigclr'){delete o.sign[b.dataset.k];save();render()}
 else if(a==='revisit'){if(!defects(o).length){toast('В этой приёмке нет недостатков');return}const n=newInspection(o);n.date=today();save();S.id=n.id;S.view='obj';render();toast('Создан повторный осмотр: '+defects(n).length+' недостатков к проверке')}
 else if(a==='a2hs'){LS.set('pr:a2hs',true);render()}
 else if(a==='checknorms')updateNorms(true);else if(a==='normsDiffOk'){S.normsDiff=null;render()}
 else if(a==='override'){const k=b.dataset.k,n=NORMS.norms[k],l=n.limit;const cur0=DB.settings.overrides[k];const lim=JSON.parse(JSON.stringify((cur0||{}).limit||l));
  if(l.t==='perM'){const v=num(prompt('Свой допуск, мм на 1 м (по договору):',String(lim.perM).replace('.',',')));if(v==null)return;lim.perM=v;const mx=prompt('Не более, мм (пусто — без ограничения):',lim.max==null?'':String(lim.max).replace('.',','));lim.max=num(mx)}
  else if(l.t==='max'||l.t==='pct'){const v=num(prompt(l.t==='pct'?'Не более, мм:':'Свой допуск, мм (по договору):',String(lim.max).replace('.',',')));if(v==null)return;lim.max=v}
  const reason=prompt('Основание (например «п. 4.2 договора»):',(cur0||{}).reason||'')||'';DB.settings.overrides[k]={limit:lim,reason};save();render();toast('Свой допуск применится к новым приёмкам')}
 else if(a==='unoverride'){delete DB.settings.overrides[b.dataset.k];save();render()}
 else if(a==='backup')backup();else if(a==='restore'){$('#backupIn').value='';$('#backupIn').click()}
 else if(a==='rfon'){if(NATIVE){BLE.devices=[];BLE.state='connecting';rfBar();NATIVE.bleConnect()}}
 else if(a==='rfmeasure'){NATIVE&&NATIVE.bleMeasure()}else if(a==='rfoff'){BLE2&&BLE2.disconnect();BLE.state='off';rfBar()}
 else if(a==='rfpick'){if(BLE2){BLE.state='connecting';BLE.name=b.dataset.name;rfBar();BLE2.connect(b.dataset.addr,b.dataset.kind,b.dataset.name)}}});
document.addEventListener('change',e=>{const t=e.target,o=cur();
 if(t.id==='photoIn'||t.id==='photoGal'){if(t.files.length)addPhotoFiles([...t.files]).catch(err=>toast('Фото не добавлено: '+err.message));return}
 if(t.id==='backupIn'){if(t.files[0])restore(t.files[0]);return}
 if(t.dataset.o!=null){o[t.dataset.o]=t.value.trim();save();if(t.dataset.o!=='conclusion')render();return}
 if(t.dataset.s!=null){DB.settings[t.dataset.s]=t.value.trim();save();return}
 if(t.dataset.r!=null){const r=roomById(o,S.room),k=t.dataset.r;let v=t.value.trim();if(['a','b','h','area','hp'].includes(k)&&v!==''){const n=num(v);if(n==null||n<=0||n>(k==='area'?1000:50)){toast('Введите размер в метрах, например 3,45');render();return}v=String(n)}r[k]=v;save();render();return}
 if(t.dataset.note!=null){const[rid,cid]=t.dataset.note.split('|');itemsOf(o,rid)[cid].note=t.value.trim();save();return}
 if(t.dataset.m!=null){const[rid,cid]=t.dataset.m.split('|'),its=itemsOf(o,rid),it=its[cid]=its[cid]||{};it.v=it.v||{};const v=t.value.trim();if(v===''){delete it.v[t.dataset.k]}else{const n=num(v);if(n==null||n<0||n>(t.dataset.k==='b'?100:1000)){toast(t.dataset.k==='b'?'Длина в метрах, например 2':'Величина в миллиметрах, например 4');t.value='';return}it.v[t.dataset.k]=n}
  const room=roomById(o,rid),c=checklist(o,room).find(x=>x.id===cid),ev=evaluate(normOf(o,c.norm),c.m,it.v,room);if(ev&&!it.revisit){const was=it.st;it.st=ev.bad?'def':'ok';save();if(was!==it.st){render();return}}save();
  const el=document.getElementById('ev-'+t.dataset.m);if(el){el.className='verdict '+(ev?(ev.bad?'bad':'ok'):'');el.textContent=ev?(ev.bad?'✗ ':'✓ ')+ev.text:''}}});
window.appBack=()=>{if(document.querySelector('.modal')){document.querySelector('.modal').remove();return true}if(S.view==='room'||S.view==='act'){S.view='obj';render();return true}if(S.view==='obj'||S.view==='settings'){S.view='home';render();return true}if(S.view==='norms'){S.view='settings';render();return true}return false};
const pst=document.createElement('style');pst.textContent='.printonly{display:none}@media print{.printonly{display:block}.sigimg[src=""]{display:none}}';document.head.appendChild(pst);
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
render();if(S.view!=='login')updateNorms(false);
window.__pr={DB,S,checklist,evaluate,normOf,defects,stats,totalArea,newInspection,render,cmpVer,diffNorms,get NORMS(){return NORMS},rfValue};
</script>
