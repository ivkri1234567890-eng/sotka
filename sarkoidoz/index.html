<head>

<style>
/* Calm health companion: airy blue-teal palette, soft cards, large touch targets; charts in SVG. */
:root{--bg:#f2f6f8;--surface:#fff;--sunk:#e9f0f3;--ink:#17262e;--muted:#5f727c;--line:#d9e3e8;--acc:#2f6f8f;--acc2:#3fa38a;--acc-ink:#fff;--ok:#2e8b57;--ok-bg:#e2f4ea;--bad:#c2410c;--bad-bg:#fdeee4;--warn:#8a6d00;--warn-bg:#fdf6d8;--font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--mono:ui-monospace,"Roboto Mono",Consolas,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1619;--surface:#172126;--sunk:#1e2a30;--ink:#e6eef1;--muted:#93a7b0;--line:#2a3a42;--acc:#7cc0de;--acc2:#6fd0b4;--acc-ink:#071419;--ok:#6cc792;--ok-bg:#15301f;--bad:#ff8a5c;--bad-bg:#3a1f12;--warn:#e8c75a;--warn-bg:#352d10}}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--font);-webkit-tap-highlight-color:transparent}
body{padding:env(safe-area-inset-top) 0 0}
main{max-width:760px;margin:0 auto;padding:0 16px calc(96px + env(safe-area-inset-bottom))}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:8px;padding:10px 16px;max-width:760px;margin:0 auto}
header.top h1{font-size:20px;margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
h2{font-size:18px;margin:18px 0 8px}h3{font-size:16px;margin:0 0 6px}
.muted{color:var(--muted)}.small{font-size:13px}.n{font-family:var(--mono);font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0}
.btn{appearance:none;border:1px solid transparent;background:var(--acc);color:var(--acc-ink);font:600 15px var(--font);padding:10px 14px;border-radius:12px;min-height:44px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn.sec{background:var(--surface);color:var(--ink);border-color:var(--line)}.btn.ghost{background:transparent;color:var(--acc)}.btn.bad{background:transparent;color:var(--bad);border-color:var(--line)}.btn.sm{min-height:34px;padding:5px 10px;font-size:14px}.btn.wide{width:100%}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.grow{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
label.f{display:block;font-size:13px;color:var(--muted)}label.f input,label.f select,label.f textarea{margin-top:3px}
input,select,textarea{font:16px var(--font);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-height:42px;width:100%;min-width:0}
textarea{min-height:70px;resize:vertical}input[type=range]{padding:0;min-height:32px;border:0;background:transparent;accent-color:var(--acc)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:0}
.list .it{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:14px;padding:12px;margin:8px 0;font:15px var(--font);cursor:pointer}
.ico{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;background:var(--sunk);flex:0 0 auto}
.badge{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.badge.bad{background:var(--bad-bg);color:var(--bad)}.badge.ok{background:var(--ok-bg);color:var(--ok)}.badge.warn{background:var(--warn-bg);color:var(--warn)}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:7px 12px;font:14px var(--font);cursor:pointer;min-height:36px}.chip.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}.tabs .chip{flex:0 0 auto}
.warnbox{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:14px;margin:10px 0}
.redbox{background:var(--bad-bg);color:var(--bad);border-radius:12px;padding:10px 12px;font-size:14px;margin:10px 0}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding:4px 4px calc(4px + env(safe-area-inset-bottom))}
.nav button{flex:1;max-width:150px;border:0;background:transparent;color:var(--muted);font:600 11px var(--font);padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;min-height:52px}.nav button span{font-size:21px;line-height:1}.nav button.on{color:var(--acc)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:40;max-width:calc(100% - 32px);font-size:14px}
.modal{position:fixed;inset:0;z-index:30;background:#000c;display:flex;align-items:center;justify-content:center;padding:16px}.modal .box{background:var(--surface);color:var(--ink);border-radius:16px;max-width:560px;width:100%;max-height:90vh;overflow:auto;padding:16px}
.login{max-width:380px;margin:12vh auto 0;text-align:center}.login img{width:84px;height:84px;border-radius:22px}
table.t{width:100%;border-collapse:collapse;font-size:14px}table.t td,table.t th{border-bottom:1px solid var(--line);padding:7px 4px;text-align:left;vertical-align:top}table.t th{font-size:12px;color:var(--muted);font-weight:600}
.up{color:var(--bad)}.down{color:var(--bad)}.better{color:var(--ok)}.flat{color:var(--muted)}
.scale{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.motiv{position:relative;border-radius:18px;overflow:hidden;aspect-ratio:4/5;max-height:62vh;margin:10px auto;display:block;width:100%}.motiv canvas{width:100%;height:100%;display:block}
.breath{width:220px;height:220px;margin:16px auto;border-radius:50%;background:radial-gradient(circle,var(--acc2),var(--acc));opacity:.85;display:flex;align-items:center;justify-content:center;color:#fff;font:700 22px var(--font);transform:scale(.6);transition:transform 1s linear}
.sec{font-size:13px;color:var(--muted)}
.streak{font:700 28px var(--font);color:var(--acc)}
.chart{width:100%;height:auto;display:block}
.doc{background:#fff;color:#111;font:13px/1.45 system-ui,sans-serif;padding:18px;border-radius:8px;border:1px solid var(--line)}.doc h1{font-size:19px;margin:0 0 4px}.doc table{width:100%;border-collapse:collapse;margin:8px 0}.doc td,.doc th{border:1px solid #bbb;padding:4px 6px;text-align:left;vertical-align:top}.doc th{background:#eef3f5}
.prompt{white-space:pre-wrap;font:13px/1.45 var(--mono);background:var(--sunk);border-radius:12px;padding:12px;max-height:50vh;overflow:auto}
@media print{body{background:#fff;padding:0}header.top,.nav,.noprint,#toast{display:none!important}main{max-width:none;padding:0}.doc{border:0;padding:0}@page{size:A4;margin:12mm}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" hidden></div>
<input type="file" id="fileIn" accept="image/*,application/pdf" multiple hidden>
<input type="file" id="backupIn" accept="application/json,.json" hidden>
<script>
"use strict";
/* ============ content: markers, schedules, exercises, advice, affirmations, AI prompt ============ */
/* ref ranges are typical adult values; every lab has its own — user can edit them per marker */
const MARKERS=[
 {k:'ace',n:'АПФ (ангиотензинпревращающий фермент)',u:'Ед/л',lo:8,hi:52,g:'Активность',why:'Отражает «объём» гранулём в организме. Не подтверждает и не исключает саркоидоз, но в динамике помогает оценить активность. Препараты от давления — ингибиторы АПФ (эналаприл, лизиноприл и др.) — снижают показатель: скажите о них врачу.'},
 {k:'sil2r',n:'Растворимый рецептор ИЛ-2 (sIL-2R)',u:'Ед/мл',lo:158,hi:623,g:'Активность',why:'Маркер активности воспаления. Полезен в динамике, если ваша лаборатория его выполняет.'},
 {k:'crp',n:'С-реактивный белок (СРБ)',u:'мг/л',lo:0,hi:5,g:'Активность',why:'Общий маркер воспаления. Повышается и при инфекциях.'},
 {k:'esr',n:'СОЭ',u:'мм/ч',lo:2,hi:20,g:'Активность',why:'Общий показатель воспаления, неспецифичен.'},
 {k:'ca',n:'Кальций общий (кровь)',u:'ммоль/л',lo:2.15,hi:2.55,g:'Кальций и витамин D',why:'Гранулёмы могут вырабатывать активный витамин D и повышать кальций. Высокий кальций опасен для почек — показатель важно контролировать.'},
 {k:'cai',n:'Кальций ионизированный',u:'ммоль/л',lo:1.03,hi:1.29,g:'Кальций и витамин D',why:'Точнее отражает «свободный» кальций крови.'},
 {k:'cau',n:'Кальций в суточной моче',u:'ммоль/сут',lo:2.5,hi:7.5,g:'Кальций и витамин D',why:'Повышенное выведение кальция с мочой — ранний признак нарушения обмена кальция и риска камней в почках.'},
 {k:'vd25',n:'Витамин D 25(OH)D',u:'нг/мл',lo:30,hi:100,g:'Кальций и витамин D',why:'Запасы витамина D. При саркоидозе низкий 25(OH)D не всегда означает дефицит: активная форма может быть высокой. Добавки витамина D — только после оценки врачом.'},
 {k:'vd125',n:'Витамин D 1,25(OH)₂D (активная форма)',u:'пг/мл',lo:19.9,hi:79.3,g:'Кальций и витамин D',why:'Активная форма витамина D. Её стоит оценить вместе с 25(OH)D и кальцием перед назначением витамина D.'},
 {k:'creat',n:'Креатинин',u:'мкмоль/л',lo:53,hi:115,g:'Почки и печень',why:'Функция почек. Важен при повышенном кальции и на фоне лечения.'},
 {k:'alp',n:'Щелочная фосфатаза (ЩФ)',u:'Ед/л',lo:40,hi:129,g:'Почки и печень',why:'Повышение может указывать на вовлечение печени.'},
 {k:'alt',n:'АЛТ',u:'Ед/л',lo:0,hi:41,g:'Почки и печень',why:'Печёночный фермент. Контролируется на метотрексате и других препаратах.'},
 {k:'ast',n:'АСТ',u:'Ед/л',lo:0,hi:40,g:'Почки и печень',why:'Печёночный фермент.'},
 {k:'wbc',n:'Лейкоциты',u:'×10⁹/л',lo:4,hi:9,g:'Кровь',why:'Контроль на фоне лечения. Гормоны повышают лейкоциты, иммуносупрессоры могут снижать.'},
 {k:'lym',n:'Лимфоциты (абс.)',u:'×10⁹/л',lo:1.2,hi:3,g:'Кровь',why:'При активном саркоидозе лимфоциты крови часто снижены.'},
 {k:'hb',n:'Гемоглобин',u:'г/л',lo:120,hi:160,g:'Кровь',why:'Анемия может усиливать слабость и одышку.'},
 {k:'glu',n:'Глюкоза',u:'ммоль/л',lo:3.9,hi:6.1,g:'На фоне гормонов',why:'Гормоны (преднизолон, метилпреднизолон) могут повышать сахар крови.'},
 {k:'fvc',n:'ФЖЕЛ (форсированная ЖЕЛ)',u:'% от должного',lo:80,hi:null,g:'Дыхание',why:'Главный показатель объёма лёгких при спирометрии. Снижение на 10% и более от исходного — повод обсудить с врачом.'},
 {k:'fev1',n:'ОФВ₁',u:'% от должного',lo:80,hi:null,g:'Дыхание',why:'Объём форсированного выдоха за 1 секунду — проходимость бронхов.'},
 {k:'dlco',n:'DLCO (диффузионная способность)',u:'% от должного',lo:80,hi:null,g:'Дыхание',why:'Насколько хорошо кислород переходит из лёгких в кровь. Часто чувствительнее спирометрии.'},
 {k:'spo2',n:'Сатурация SpO₂ в покое',u:'%',lo:95,hi:100,g:'Дыхание',why:'Насыщение крови кислородом. Падение ниже 90% — повод срочно обратиться к врачу.'},
 {k:'smwt',n:'Тест 6-минутной ходьбы',u:'м',lo:null,hi:null,g:'Дыхание',why:'Сколько метров вы проходите за 6 минут. Смотрим на динамику и падение сатурации при ходьбе.'},
 {k:'tsh',n:'ТТГ',u:'мЕд/л',lo:0.4,hi:4,g:'Прочее',why:'Функция щитовидной железы — частая причина усталости.'},
];
const GROUPS=['Активность','Кальций и витамин D','Дыхание','Кровь','Почки и печень','На фоне гормонов','Прочее'];
/* typical follow-up items; intervals are a starting point to agree with the doctor */
const PLAN_TEMPLATES=[
 {t:'Спирометрия и DLCO (ФВД)',m:6,why:'Основной контроль лёгких: на старте лечения обычно каждые 3–6 мес.'},
 {t:'Кальций крови, креатинин, ЩФ',m:6,why:'Контроль обмена кальция, почек и печени.'},
 {t:'Кальций в суточной моче',m:12,why:'По назначению врача, особенно при повышенном кальции или камнях.'},
 {t:'АПФ / sIL-2R, СРБ, ОАК',m:6,why:'Динамика активности и контроль крови.'},
 {t:'Осмотр офтальмолога (щелевая лампа)',m:12,why:'Глаза могут поражаться без симптомов; на гормонах — также контроль давления в глазу и хрусталика.'},
 {t:'ЭКГ (по назначению — Холтер, ЭхоКГ)',m:12,why:'Скрининг поражения сердца.'},
 {t:'Рентген / КТ органов грудной клетки',m:12,why:'По назначению пульмонолога.'},
 {t:'Приём пульмонолога',m:6,why:'Оценка динамики и решение о лечении.'},
 {t:'Глюкоза, давление, вес (на гормонах)',m:3,why:'Контроль побочных эффектов глюкокортикоидов.'},
 {t:'Денситометрия (на гормонах)',m:12,why:'Защита костей при длительном приёме гормонов.'},
 {t:'ОАК, печёночные пробы (на метотрексате и др.)',m:2,why:'Обязательный контроль безопасности иммуносупрессоров.'},
];
const EXERCISES=[
 {k:'diaph',t:'Диафрагмальное дыхание',cat:'Дыхание',min:5,breath:[4,0,6,0],steps:['Сядьте удобно или лягте, колени согнуты.','Одна ладонь на груди, другая на животе.','Медленный вдох носом — поднимается живот, грудь почти неподвижна.','Плавный длинный выдох — живот опускается.','5–10 минут, 1–3 раза в день.'],note:'Помогает дышать эффективнее и снижает тревогу при одышке.'},
 {k:'lips',t:'Дыхание с сомкнутыми губами',cat:'Дыхание',min:3,breath:[2,0,4,0],steps:['Вдох носом на 2 счёта.','Сложите губы трубочкой, как будто задуваете свечу.','Медленный выдох на 4 счёта — в два раза длиннее вдоха.','Используйте при одышке: на лестнице, при ходьбе, при волнении.'],note:'Снимает чувство нехватки воздуха и замедляет дыхание.'},
 {k:'box',t:'Квадратное дыхание (успокоение)',cat:'Дыхание',min:4,breath:[4,4,4,4],steps:['Вдох — 4 счёта.','Пауза — 4.','Выдох — 4.','Пауза — 4. Повторяйте 4–5 минут.'],note:'Для сна и стресса. Если паузы вызывают дискомфорт — уберите их.'},
 {k:'walk',t:'Ходьба в комфортном темпе',cat:'Выносливость',min:15,steps:['Темп, при котором можете говорить, но не петь (одышка 3–4 из 10).','Начните с 10–15 минут, добавляйте по 2–3 минуты в неделю до 30 минут.','3–5 раз в неделю. Можно разбить на 2–3 коротких прогулки.','Если есть пульсоксиметр — следите, чтобы SpO₂ не падала ниже 88–90%.'],note:'Регулярная аэробная нагрузка уменьшает усталость и одышку.'},
 {k:'sts',t:'Вставания со стула',cat:'Сила',min:5,steps:['Сядьте на край устойчивого стула, ноги на ширине плеч.','Встаньте без помощи рук, медленно сядьте.','2–3 подхода по 8–12 раз, отдых 1–2 минуты.','Легче — с опорой руками; сложнее — медленнее опускаться.'],note:'Сила ног — основа выносливости в быту.'},
 {k:'calf',t:'Подъёмы на носки и отжимания от стены',cat:'Сила',min:6,steps:['Подъёмы на носки у опоры: 2–3 × 12–15.','Отжимания от стены: 2–3 × 8–12.','Выдох — на усилии, не задерживайте дыхание.'],note:'Через день, 2–3 раза в неделю.'},
 {k:'chest',t:'Растяжка грудной клетки',cat:'Гибкость',min:5,steps:['Встаньте в дверной проём, предплечья на косяках.','Мягко подайте корпус вперёд до лёгкого растяжения, 20–30 секунд.','Повороты корпуса сидя: руки на плечах, 5–8 раз в каждую сторону.','Глубокий вдох при раскрытии груди.'],note:'Помогает грудной клетке двигаться свободнее при дыхании.'},
 {k:'pace',t:'Энергосбережение — правило 3П',cat:'Усталость',min:3,steps:['Планируйте: важные дела — на время, когда сил больше.','Приоритизируйте: что можно отложить, делегировать или упростить.','Пауза: отдых до того, как наступило истощение.','Отмечайте усталость в дневнике — через 2–3 недели увидите свой ритм.'],note:'Усталость при саркоидозе реальна и частая. Это не лень.'},
];
const ADVICE=[
 {t:'Когда срочно к врачу',red:1,items:['Перебои в сердце, сердцебиение, обмороки или предобмороки — возможное поражение сердца.','Резкое ухудшение зрения, боль, покраснение глаза, светобоязнь — возможный увеит.','Сильная жажда, частое мочеиспускание, тошнота, спутанность — признаки высокого кальция.','Быстро нарастающая одышка, SpO₂ ниже 90%, кровохарканье, боль в груди.','Онемение, асимметрия лица, сильная головная боль, судороги.','Высокая температура на фоне иммуносупрессоров.']},
 {t:'Витамин D, кальций и солнце',items:['Не начинайте витамин D и кальций самостоятельно: при саркоидозе они могут поднять кальций до опасного уровня.','Перед назначением врач обычно смотрит кальций крови (и мочи), 25(OH)D и 1,25(OH)₂D.','Если кальций повышен — умеренность с солнцем, пейте достаточно воды, если врач не ограничил жидкость.','На гормонах защита костей важна — обсудите с врачом, как сделать её безопасно.']},

Помочь человеку понимать свою болезнь и анализы, готовиться к визитам к врачу, держать режим наблюдения и сохранять спокойный, позитивный настрой — не подменяя лечащего врача.

ЧТО ТЫ ДЕЛАЕШЬ
1. Объясняешь анализы и обследования простыми словами: что показатель означает, какая у него динамика, с чем она может быть связана — с оговоркой, что нормы зависят от лаборатории, а выводы делает врач.

5. Поддерживаешь эмоционально: признаёшь чувства, помогаешь переформулировать тревожные мысли в реалистичные и обнадёживающие, отмечаешь прогресс.

ЖЁСТКИЕ ПРАВИЛА БЕЗОПАСНОСТИ
- Не ставь диагноз, не назначай и не отменяй лекарства, не меняй дозы. Гормоны нельзя отменять резко — только по схеме врача.
- Не советуй самостоятельно принимать витамин D и кальций: при саркоидозе это может вызвать опасный рост кальция.
- Если в данных или словах человека есть «красные флаги» — сначала и коротко скажи обратиться за срочной помощью: перебои в сердце, обмороки, боль в груди; резкое ухудшение зрения, боль или покраснение глаза; сильная жажда, частое мочеиспускание, спутанность; SpO₂ ниже 90%, быстро нарастающая одышка, кровохарканье; неврологические симптомы; высокая температура на иммуносупрессорах.
- Если человек говорит о безнадёжности или мыслях о том, чтобы причинить себе вред, — отнесись с теплом и серьёзно, предложи связаться с близкими и специалистом, дай контакты экстренной помощи (в России — 112).
- Опирайся на современные рекомендации (клинические рекомендации Минздрава РФ «Саркоидоз», ATS 2020, ERS 2021). Если не уверен — так и скажи. Не выдумывай исследования и цифры.

СТИЛЬ
- Тёплый, уважительный, на «вы» (если человек не попросит иначе). Короткие абзацы, понятные слова, термины — с пояснением.
- Реалистичный оптимизм: факты без запугивания, надежда без ложных обещаний.
- В конце каждого ответа — 1–3 конкретных маленьких шага на ближайшие дни и одна поддерживающая фраза.

3) Вопросы к врачу.
4) Ближайшие шаги (обследования по календарю, упражнения, режим).
5) Слова поддержки.

function diaryChart(){const days=[];for(let i=29;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);days.push(iso(d))}const pts=k=>days.map((d,i)=>[i,DB.diary[d]&&DB.diary[d][k]!=null?+DB.diary[d][k]:null]);const w=640,h=200,L=30,Rr=10,T=10,B=26,X=i=>L+i/29*(w-L-Rr),Y=v=>T+(10-v)/10*(h-T-B);
 if(!days.some(d=>DB.diary[d]))return'<p class="small muted">Отмечайте самочувствие — здесь появится график.</p>';
 const line=(k,c)=>{let p='',s='';for(const[i,v]of pts(k)){if(v==null){p+=s?' ':'';s='';continue}p+=(s?'L':'M')+X(i)+','+Y(v);s='1'}return`<path d="${p}" fill="none" stroke="${c}" stroke-width="2.5"/>`};
 let g=`<svg class="chart" viewBox="0 0 ${w} ${h}">`;for(let v=0;v<=10;v+=5)g+=`<line x1="${L}" x2="${w-Rr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${Y(v)+4}" font-size="11" text-anchor="end" fill="var(--muted)">${v}</text>`;
 g+=line('fat','#e07a5f')+line('dysp','#3d85c6')+line('sleep','#3fa38a');g+=`<text x="${L}" y="${h-6}" font-size="11" fill="var(--muted)">${ruShort(days[0])}</text><text x="${w-Rr}" y="${h-6}" font-size="11" text-anchor="end" fill="var(--muted)">сегодня</text></svg>`;

/* ---- profile ---- */
const ORGANS=['Лёгкие','Внутригрудные лимфоузлы','Кожа','Глаза','Сердце','Суставы','Печень','Почки','Нервная система','Периферические лимфоузлы','Селезёнка'];
function vProfile(){const p=DB.profile;return topBar('Профиль и лекарства','more')+`<main><div class="card"><div class="grid2"><label class="f">Как к вам обращаться<input data-pf="name" value="${esc(p.name)}"></label><label class="f">Диагноз поставлен<input type="date" data-pf="dx" value="${esc(p.dx)}"></label><label class="f">Стадия (рентгенологическая)<select data-pf="stage">${['','0','I','II','III','IV','Не знаю'].map(s=>`<option ${p.stage===s?'selected':''}>${s}</option>`).join('')}</select></label><label class="f">Лечащий врач<input data-pf="doctor" value="${esc(p.doctor)}"></label></div>
 <div class="small muted" style="margin-top:10px">Поражение органов</div><div class="chips" style="margin-top:6px">${ORGANS.map(o=>`<button class="chip ${p.organs.includes(o)?'on':''}" data-a="organ" data-o="${o}">${o}</button>`).join('')}</div></div>
 <div class="card"><div class="row"><h3 class="grow" style="margin:0">Лекарства</h3><button class="btn sec sm" data-a="medadd">+ Добавить</button></div>
 ${p.meds.map((m,i)=>`<div style="border-top:1px solid var(--line);padding:8px 0;margin-top:8px"><div class="grid2"><label class="f">Препарат<input data-md="n" data-i="${i}" value="${esc(m.n)}" placeholder="Преднизолон"></label><label class="f">Доза, схема<input data-md="dose" data-i="${i}" value="${esc(m.dose||'')}" placeholder="20 мг утром"></label><label class="f">Время приёма<input type="time" data-md="time" data-i="${i}" value="${esc(m.time||'')}"></label><label class="f">Как часто<select data-md="weekly" data-i="${i}"><option value="">Каждый день</option><option value="1" ${m.weekly?'selected':''}>Раз в неделю</option></select></label>${m.weekly?`<label class="f">День недели<select data-md="wd" data-i="${i}">${['Вс','Пн','Вт','Ср','Чт','Пт','Сб'].map((d,j)=>`<option value="${j}" ${String(m.wd||0)===String(j)?'selected':''}>${d}</option>`).join('')}</select></label>`:''}</div>
 <div class="row" style="margin-top:6px"><label class="row small"><input type="checkbox" data-md="rem" data-i="${i}" ${m.rem?'checked':''} style="width:20px;min-height:20px"> напоминать${NATIVE?'':' (в приложении для Android)'}</label><span class="grow"></span><button class="btn bad sm" data-a="meddel" data-i="${i}">Удалить</button></div></div>`).join('')}
 <p class="small muted">Дозы меняет только врач. Гормоны нельзя отменять резко.</p></div></main>`}

/* ============ files ============ */
let attachTarget=null;
async function readFile(f){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=()=>rej(fr.error);fr.readAsDataURL(f)})}
async function shrinkImage(dataUrl,max=2000){return new Promise(res=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height));if(k===1&&dataUrl.length<1.5e6){res(dataUrl);return}const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.85))};im.onerror=()=>res(dataUrl);im.src=dataUrl})}
async function openFile(id){const f=await FS.get(id);if(!f){toast('Файл не найден');return}if(NATIVE&&NATIVE.openData){NATIVE.openData(f.name,f.data.split(',')[1],f.mime);return}
 if(f.mime.startsWith('image/')){const m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="box" style="padding:8px"><img src="${f.data}" style="width:100%;display:block;border-radius:10px" alt=""><p style="text-align:center"><button class="btn" data-x="1">Закрыть</button></p></div>`;m.onclick=e=>{if(e.target===m||e.target.dataset.x)m.remove()};document.body.appendChild(m);return}
 const b=await (await fetch(f.data)).blob();const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.target='_blank';a.download=f.name;document.body.appendChild(a);a.click();a.remove()}
async function shareFile(name,blob){if(NATIVE&&NATIVE.shareData){const d=await readFile(blob);NATIVE.shareData(name,d.split(',')[1],blob.type);return}
 const file=new File([blob],name,{type:blob.type});try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});return}}catch(e){if(e.name==='AbortError')return}
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();toast('Файл сохранён: '+name)}
async function backup(){const ids=DB.results.flatMap(r=>(r.files||[]).map(f=>f.id)),files={};for(const id of ids){const f=await FS.get(id);if(f)files[id]=f}await shareFile('sarkoidoz-backup-'+todayISO()+'.json',new Blob([JSON.stringify({app:'sarko',v:1,db:DB,files})],{type:'application/json'}))}
async function restore(file){try{const d=JSON.parse(await file.text());if(d.app!=='sarko'||!d.db)throw Error('это не копия дневника');if(!confirm('Заменить текущие данные данными из копии?'))return;for(const f of Object.values(d.files||{}))await FS.put(f);LS.set('sk:db',d.db);location.reload()}catch(e){toast('Не удалось восстановить: '+e.message,4000)}}

/* ============ events ============ */
document.addEventListener('submit',async e=>{if(e.target.id!=='loginF')return;e.preventDefault();if((await sha256(PASS_SALT+$('#pass').value.trim()))===PASS_HASH){LS.set('sk:auth',true);S.view='home';S.tab='home';render()}else{toast('Неверный пароль');$('#pass').value=''}});
document.addEventListener('click',async e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;if(b.tagName==='A')e.preventDefault();
 if(a==='go'){const v=b.dataset.v;S.view=v;if(['home','labs','diary','cal','more'].includes(v))S.tab=v;render()}
 else if(a==='grp'){S.grp=b.dataset.g;render()}else if(a==='marker'){S.m=b.dataset.k;S.view='marker';render()}
 else if(a==='newres'){S.edit={id:uid(),date:todayISO(),lab:'',vals:{},files:[],note:'',_new:1};S.view='result';S.tab='labs';render()}
 else if(a==='editres'){S.edit=JSON.parse(JSON.stringify(DB.results.find(r=>r.id===b.dataset.id)));S.view='result';render()}
 else if(a==='saveres'){const r=S.edit;if(!Object.keys(r.vals).length&&!(r.files||[]).length){toast('Введите хотя бы один показатель или прикрепите бланк');return}delete r._new;const i=DB.results.findIndex(x=>x.id===r.id);if(i>=0)DB.results[i]=r;else DB.results.push(r);save();toast('Сохранено');S.view='labs';render()}
 else if(a==='delres'){if(!confirm('Удалить эту запись?'))return;(S.edit.files||[]).forEach(f=>FS.del(f.id));DB.results=DB.results.filter(x=>x.id!==S.edit.id);save();S.view='labs';render()}
 else if(a==='attach'){attachTarget=S.edit;$('#fileIn').value='';$('#fileIn').click()}
 else if(a==='openfile')openFile(b.dataset.id);
 else if(a==='addcustom'){const n=prompt('Название показателя (например, «Хитотриозидаза»)');if(!n)return;const u=prompt('Единицы измерения','')||'';DB.custom.push({k:'c'+uid(),n,u,lo:null,hi:null,why:'Ваш показатель.'});S.grp='Мои показатели';save();render()}
 else if(a==='delcustom'){if(!confirm('Удалить показатель и его значения?'))return;const k=b.dataset.k;DB.custom=DB.custom.filter(c=>c.k!==k);DB.results.forEach(r=>{if(r.vals)delete r.vals[k]});save();S.view='labs';render()}
 else if(a==='mood'){const d=diaryDay();d.mood=+b.dataset.v;save();render()}
 else if(a==='medtake'){const d=diaryDay();d.meds=d.meds||[];const id=b.dataset.id;d.meds=d.meds.includes(id)?d.meds.filter(x=>x!==id):d.meds.concat(id);save();render()}
 else if(a==='padd'){S.pe={id:uid(),t:'',date:addMonths(todayISO(),1),time:'09:00',pre:1,kind:'lab',_new:1};render()}
 else if(a==='ptpl'){const t=PLAN_TEMPLATES[+b.dataset.i];S.pe={id:uid(),t:t.t,date:addMonths(todayISO(),t.m),time:'09:00',pre:1,kind:/Приём/.test(t.t)?'visit':'lab',rep:String(t.m),note:t.why,_new:1};render();window.scrollTo(0,0)}
 else if(a==='pedit'){S.pe=JSON.parse(JSON.stringify(DB.plan.find(p=>p.id===b.dataset.id)));render();window.scrollTo(0,0)}
 else if(a==='psave'){const p=S.pe;if(!p.t||!p.date){toast('Укажите, что и когда');return}delete p._new;const i=DB.plan.findIndex(x=>x.id===p.id);if(i>=0)DB.plan[i]=p;else DB.plan.push(p);S.pe=null;save();askNotify();render();toast('Сохранено в плане')}
 else if(a==='pcancel'){S.pe=null;render()}else if(a==='pdel'){DB.plan=DB.plan.filter(x=>x.id!==S.pe.id);S.pe=null;save();render()}
 else if(a==='pdone'){e.stopPropagation();const p=DB.plan.find(x=>x.id===b.dataset.id);p.done=true;p.doneAt=todayISO();const rep=num(p.rep);if(rep)DB.plan.push({...p,id:uid(),done:false,doneAt:null,date:addMonths(p.date<todayISO()?todayISO():p.date,rep)});save();render();toast(rep?'Готово! Следующее — через '+rep+' мес.':'Отмечено как выполненное')}
 else if(a==='ics'){const items=DB.plan.filter(p=>!p.done&&p.date);if(!items.length){toast('План пуст');return}await shareFile('plan-sarkoidoz.ics',new Blob([ics(items)],{type:'text/calendar'}))}
 else if(a==='exopen'){S.ex=b.dataset.k;S.view='exrun';render()}
 else if(a==='runstart'){const ex=EXERCISES.find(x=>x.k===S.ex);if(run){clearInterval(run.i);run=null;b.textContent='Продолжить';return}run={left:run&&run.left||ex.min*60};const el=$('#timer');const [mm,ss]=el.textContent.split(':').map(Number);run.left=mm*60+ss||ex.min*60;run.i=setInterval(()=>runTick(ex),1000);b.textContent='Пауза'}
 else if(a==='rundone'){if(run){clearInterval(run.i);run=null}finishEx(S.ex)}
 else if(a==='mprev'||a==='mnext'){S.myCard=null;S.motiv+=a==='mnext'?1:-1;paintMotiv()}
 else if(a==='myaff'){const t=$('#myaff').value.trim();if(!t)return;DB.myAff=t;save();S.myCard=t;paintMotiv()}
 else if(a==='mshare'){const cv=$('#mcv');cv.toBlob(bl=>shareFile('nastroy-'+todayISO()+'.png',bl),'image/png')}
 else if(a==='copyprompt'){const t=AI_PROMPT.replace('{{СВОДКА}}',summary());try{await navigator.clipboard.writeText(t);toast('Промпт скопирован — вставьте его в чат с ИИ')}catch(err){if(NATIVE&&NATIVE.copy){NATIVE.copy(t);toast('Промпт скопирован')}else{const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();toast('Промпт скопирован')}}}
 else if(a==='shareprompt'){const t=AI_PROMPT.replace('{{СВОДКА}}',summary());if(NATIVE&&NATIVE.shareText)NATIVE.shareText('Промпт',t);else if(navigator.share)navigator.share({text:t}).catch(()=>{});else toast('Используйте «Скопировать»')}
 else if(a==='print'){if(NATIVE&&NATIVE.printPage)NATIVE.printPage('Сводка для врача '+todayISO());else window.print()}
 else if(a==='organ'){const o=b.dataset.o,L=DB.profile.organs;DB.profile.organs=L.includes(o)?L.filter(x=>x!==o):L.concat(o);save();render()}
 else if(a==='medadd'){DB.profile.meds.push({id:uid(),n:'',dose:'',time:'',rem:false});save();render()}
 else if(a==='meddel'){DB.profile.meds.splice(+b.dataset.i,1);save();render()}
 else if(a==='backup')backup();else if(a==='restore'){$('#backupIn').value='';$('#backupIn').click()}});
function diaryDay(){const k=S.dd||todayISO();return DB.diary[k]=DB.diary[k]||{}}
let notifAsked=false;function askNotify(){if(NATIVE&&NATIVE.askNotify&&!notifAsked){notifAsked=true;NATIVE.askNotify()}}
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.dy&&t.type==='range'){const d=diaryDay();d[t.dataset.dy]=+t.value;const v=$('#v-'+t.dataset.dy);if(v)v.textContent=t.value;save()}});
document.addEventListener('change',async e=>{const t=e.target,v=t.value.trim();
 if(t.id==='fileIn'){const r=attachTarget;if(!r||!t.files.length)return;for(const f of t.files){if(f.size>15e6){toast('Файл больше 15 МБ: '+f.name);continue}let data=await readFile(f);if(f.type.startsWith('image/'))data=await shrinkImage(data);const id=uid();await FS.put({id,name:f.name,mime:f.type||'application/octet-stream',data});r.files=r.files||[];r.files.push({id,name:f.name,mime:f.type})}render();toast('Файл прикреплён — не забудьте «Сохранить»');return}
 if(t.id==='backupIn'){if(t.files[0])restore(t.files[0]);return}
 if(t.id==='ddate'){S.dd=v||todayISO();render();return}
 if(t.id==='dailyrem'){DB.dailyRem=v;save();askNotify();toast(v?'Напоминание в '+v:'Напоминание выключено');return}
 if(t.dataset.rs){S.edit[t.dataset.rs]=v;return}
 if(t.dataset.rv){const n=num(v);if(v===''){delete S.edit.vals[t.dataset.rv]}else if(n==null){toast('Введите число');t.value='';return}else S.edit.vals[t.dataset.rv]=n;const m=mk(t.dataset.rv),st=status(m,S.edit.vals[t.dataset.rv]),el=$('#rst-'+t.dataset.rv);if(el){el.className='badge '+(ST[st]?ST[st][1]:'');el.textContent=ST[st]?ST[st][0]:''}return}
 if(t.dataset.ref){const k=t.dataset.k;DB.refs[k]=DB.refs[k]||{};DB.refs[k][t.dataset.ref]=v===''?null:num(v);save();render();return}
 if(t.dataset.cmp){S.cmp[t.dataset.cmp]=v;render();return}
 if(t.dataset.dy&&t.type!=='range'){const d=diaryDay(),k=t.dataset.dy;if(k==='note')d.note=v;else{const n=num(v);if(v==='')delete d[k];else if(n==null){toast('Введите число');t.value='';return}else d[k]=n}save();if(k==='spo2')render();return}
 if(t.dataset.pe){S.pe[t.dataset.pe]=t.dataset.pe==='pre'?(num(v)??1):v;return}
 if(t.dataset.pf){DB.profile[t.dataset.pf]=v;save();return}
 if(t.dataset.md){const m=DB.profile.meds[+t.dataset.i];m[t.dataset.md]=t.type==='checkbox'?t.checked:v;save();if(t.dataset.md==='rem'&&t.checked)askNotify();if(t.dataset.md==='weekly')render();return}
 if(t.dataset.q){DB.questions=v;save();return}});
window.appBack=()=>{const m=document.querySelector('.modal');if(m){m.remove();return true}const back={marker:'labs',result:'labs',compare:'labs',files:'labs',ex:'more',exrun:'ex',advice:'more',motiv:'more',ai:'more',report:'more',profile:'more'}[S.view];if(back){S.view=back;render();return true}if(S.view!=='home'&&S.view!=='login'){S.view='home';S.tab='home';render();return true}return false};
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
render();syncReminders();
window.__sk={DB,S,render,trend,status,series,summary,remindersList,ics,AFFIRM};
</script>
