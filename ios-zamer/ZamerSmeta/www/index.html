<style>
:root{--bg:#f4f3f0;--surface:#fff;--ink:#1d1f22;--muted:#6b6f76;--line:#e3e0da;--acc:#e0620d;--acc-ink:#fff;--acc-soft:#fde9d9;--ok:#1f8a5b;--bad:#c2412d;--blue:#2f6fd0;

.linkbtn{border:0;background:none;color:var(--acc);font:600 12px var(--font);padding:0 4px;cursor:pointer}.elev{width:100%;height:auto;display:block}.arcbox{margin-top:10px;padding:10px;border:1px dashed var(--line);border-radius:10px}.tabs button:disabled{opacity:.4}

</style>

<body>
<div id="app"></div>
<div id="toast" hidden></div>
<script>
'use strict';
/* =================== utilities =================== */
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9);
const num=s=>{const v=parseFloat(String(s==null?'':s).replace(',','.').replace(/\s/g,''));return isFinite(v)?v:0};
const fmt=(n,d=2)=>(+n||0).toLocaleString('ru-RU',{maximumFractionDigits:d});
const rub=n=>Math.round(+n||0).toLocaleString('ru-RU')+' ₽';
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const today=()=>new Date().toLocaleDateString('ru-RU');
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,2200)}
const NATIVE=window.Native||null;

/* =================== storage =================== */
function loadDB(){try{const s=NATIVE?NATIVE.load():localStorage.getItem('zs:db');if(s)return JSON.parse(s)}catch(e){}return null}
let DB=loadDB()||{projects:[],settings:{company:'',master:'',phone:'',note:'Цены на материалы ориентировочные и уточняются при закупке. Смета действительна 14 дней.',prices:{},variant:'s'}};
window.flushDb=()=>{clearTimeout(saveT);const el=document.activeElement;if(el&&el.dataset&&el.dataset.f)el.dispatchEvent(new Event('change',{bubbles:true}));clearTimeout(saveT);const s=JSON.stringify(DB);try{NATIVE?NATIVE.save(s):localStorage.setItem('zs:db',s)}catch(e){}};
document.addEventListener('visibilitychange',()=>{if(document.hidden)window.flushDb()});
let saveT;function save(){clearTimeout(saveT);saveT=setTimeout(()=>{const s=JSON.stringify(DB);try{NATIVE?NATIVE.save(s):localStorage.setItem('zs:db',s)}catch(e){}},250)}

/* =================== price list =================== */
/* b = база количества (floor, ceil, wall, perim, skirt, slopes, demo, el, pl, doorsN), k = расход на единицу базы, c = округлять вверх до целых упаковок, p = цены [эконом, стандарт, премиум] */
const CAT={
 demo_w:{g:'w',n:'Демонтаж старых покрытий (пол и стены)',u:'м²',b:'demo',k:1,p:[150,200,250]},
 scr_w:{g:'w',n:'Стяжка пола до 5 см',u:'м²',b:'floor',k:1,p:[500,600,750]},
 scr_m:{g:'m',n:'Пескобетон для стяжки, 25 кг',u:'меш.',b:'floor',k:4,c:1,p:[380,420,520]},
 lam_w:{g:'w',n:'Укладка ламината с подложкой',u:'м²',b:'floor',k:1,p:[350,400,500]},
 lam_m:{g:'m',n:'Ламинат',u:'м²',b:'floor',k:1.07,p:[650,1100,2200]},
 und_m:{g:'m',n:'Подложка под ламинат',u:'м²',b:'floor',k:1.05,p:[60,120,250]},
 lin_w:{g:'w',n:'Укладка линолеума',u:'м²',b:'floor',k:1,p:[250,300,400]},
 lin_m:{g:'m',n:'Линолеум',u:'м²',b:'floor',k:1.1,p:[450,800,1500]},
 ftile_w:{g:'w',n:'Укладка плитки на пол',u:'м²',b:'floor',k:1,p:[1200,1400,1800]},
 ftile_m:{g:'m',n:'Керамогранит напольный',u:'м²',b:'floor',k:1.1,p:[900,1600,3500]},
 fglue_m:{g:'m',n:'Плиточный клей, 25 кг',u:'меш.',b:'floor',k:0.2,c:1,p:[450,550,750]},
 fgrout_m:{g:'m',n:'Затирка для швов, 2 кг',u:'уп.',b:'floor',k:0.25,c:1,p:[300,450,800]},
 sk_w:{g:'w',n:'Монтаж напольного плинтуса',u:'м.п.',b:'skirt',k:1,p:[150,180,250]},
 sk_m:{g:'m',n:'Плинтус напольный, 2,5 м',u:'шт',b:'skirt',k:0.44,c:1,p:[180,320,600]},
 wput_w:{g:'w',n:'Шпаклёвка стен под покраску',u:'м²',b:'wall',k:1,p:[450,550,700]},
 wpaint_w:{g:'w',n:'Покраска стен в 2 слоя',u:'м²',b:'wall',k:1,p:[250,300,400]},
 put_m:{g:'m',n:'Шпаклёвка финишная, 20 кг',u:'меш.',b:'wall',k:0.1,c:1,p:[550,800,1200]},
 prim_m:{g:'m',n:'Грунтовка, 10 л',u:'кан.',b:'wall',k:0.02,c:1,p:[600,900,1400]},
 wpaintm_m:{g:'m',n:'Краска интерьерная, 9 л',u:'вед.',b:'wall',k:0.027,c:1,p:[2200,4500,9000]},
 wprep_w:{g:'w',n:'Подготовка стен под обои',u:'м²',b:'wall',k:1,p:[300,350,450]},
 wpap_w:{g:'w',n:'Поклейка обоев',u:'м²',b:'wall',k:1,p:[300,380,500]},
 pap_m:{g:'m',n:'Обои, рулон 1,06×10 м',u:'рул.',b:'wall',k:0.128,c:1,p:[1500,2800,6000]},
 papg_m:{g:'m',n:'Клей для обоев',u:'уп.',b:'wall',k:0.04,c:1,p:[350,450,700]},
 wtile_w:{g:'w',n:'Укладка плитки на стены',u:'м²',b:'wall',k:1,p:[1300,1500,2000]},
 wtile_m:{g:'m',n:'Плитка настенная',u:'м²',b:'wall',k:1.1,p:[800,1400,3000]},
 wglue_m:{g:'m',n:'Плиточный клей для стен, 25 кг',u:'меш.',b:'wall',k:0.2,c:1,p:[450,550,750]},
 wgrout_m:{g:'m',n:'Затирка для швов (стены), 2 кг',u:'уп.',b:'wall',k:0.2,c:1,p:[300,450,800]},
 cpaint_w:{g:'w',n:'Шпаклёвка и покраска потолка',u:'м²',b:'ceil',k:1,p:[700,850,1100]},
 cput_m:{g:'m',n:'Шпаклёвка финишная для потолка, 20 кг',u:'меш.',b:'ceil',k:0.1,c:1,p:[550,800,1200]},
 cpaint_m:{g:'m',n:'Краска для потолка, 9 л',u:'вед.',b:'ceil',k:0.027,c:1,p:[1800,3500,7000]},
 cstr_w:{g:'w',n:'Натяжной потолок под ключ (с полотном)',u:'м²',b:'ceil',k:1,p:[550,750,1200]},
 cstrp_w:{g:'w',n:'Маскировочная лента по периметру',u:'м.п.',b:'perim',k:1,p:[80,120,200]},
 slope_w:{g:'w',n:'Отделка откосов',u:'м.п.',b:'slopes',k:1,p:[700,800,1000]},
 el_w:{g:'w',n:'Электроточка (розетка, выключатель)',u:'шт',b:'el',k:1,p:[450,550,700]},
 pl_w:{g:'w',n:'Сантехточка',u:'шт',b:'pl',k:1,p:[2500,3000,4000]},
 door_w:{g:'w',n:'Установка межкомнатной двери',u:'шт',b:'doorsN',k:1,p:[4500,5500,7000]}
};
const FIN={
 floor:{n:'Пол',opts:{none:{n:'Без работ',c:'#e7e4de',items:[]},laminate:{n:'Ламинат',c:'#c9a06c',items:['lam_w','sk_w','lam_m','und_m','sk_m']},linoleum:{n:'Линолеум',c:'#a7b6a2',items:['lin_w','sk_w','lin_m','sk_m']},tile:{n:'Плитка',c:'#c4cbd1',items:['ftile_w','ftile_m','fglue_m','fgrout_m']}}},
 walls:{n:'Стены',opts:{none:{n:'Без работ',items:[]},paint:{n:'Покраска',items:['wput_w','wpaint_w','put_m','prim_m','wpaintm_m']},wallpaper:{n:'Обои',items:['wprep_w','wpap_w','pap_m','papg_m','prim_m']},tile:{n:'Плитка',items:['wtile_w','wtile_m','wglue_m','wgrout_m']}}},
 ceiling:{n:'Потолок',opts:{none:{n:'Без работ',items:[]},paint:{n:'Покраска',items:['cpaint_w','cput_m','cpaint_m']},stretch:{n:'Натяжной',items:['cstr_w','cstrp_w']}}}
};
const EXTRA=[{id:'demo',n:'Демонтаж',items:['demo_w']},{id:'screed',n:'Стяжка пола',items:['scr_w','scr_m']},{id:'slopes',n:'Откосы',items:['slope_w']}];
const COUNTS=[{id:'el',n:'Электроточки',item:'el_w'},{id:'pl',n:'Сантехточки',item:'pl_w'},{id:'doorsN',n:'Установка дверей',item:'door_w'}];
const VARS=[['e','Эконом'],['s','Стандарт'],['p','Премиум']];
const VI={e:0,s:1,p:2};
const vName=v=>VARS[VI[v]][1];
const priceOf=(id,v)=>((DB.settings.prices||{})[id]||CAT[id].p)[VI[v]];
const ROOM_NAMES=['Комната','Кухня','Спальня','Гостиная','Ванная','Санузел','Коридор','Балкон'];

/* =================== geometry =================== */
function planPts(room){const pts=[[0,0]];let h=0;(room.walls||[]).forEach((w,i)=>{if(i>0)h+=num(w.t);const r=h*Math.PI/180,[x,y]=pts[pts.length-1];pts.push([x+num(w.len)*Math.cos(r),y+num(w.len)*Math.sin(r)])});return{pts,heading:h}}
function geo(room){
 const {pts,heading}=planPts(room),n=(room.walls||[]).length,last=pts[n],gap=Math.hypot(last[0],last[1]);
 const closed=n>=3&&gap<0.03;const P=closed?pts.slice(0,n):pts;let A=0;
 if(P.length>=3)for(let i=0;i<P.length;i++){const a=P[i],b=P[(i+1)%P.length];A+=a[0]*b[1]-b[0]*a[1]}
 const floor=Math.abs(A)/2,perim=(room.walls||[]).reduce((s,w)=>s+num(w.len),0),h=num(room.h),ops=room.ops||[];
 const openA=ops.reduce((s,o)=>s+num(o.w)*num(o.h),0),doorW=ops.filter(o=>o.type==='door').reduce((s,o)=>s+num(o.w),0);
 const slopes=ops.reduce((s,o)=>s+2*num(o.h)+num(o.w),0),wallGross=perim*h,wall=Math.max(0,wallGross-openA),cnt=room.cnt||{};
 return{pts,heading,closed,gap,sign:A>=0?1:-1,floor,ceil:floor,perim,h,wallGross,openA,wall,skirt:Math.max(0,perim-doorW),slopes,demo:floor+wall,el:num(cnt.el),pl:num(cnt.pl),doorsN:num(cnt.doorsN)};
}
function roomItems(room){const f=room.fin||{},ids=[];for(const k of ['floor','walls','ceiling'])ids.push(...FIN[k].opts[f[k]||'none'].items);
 for(const x of EXTRA)if(f[x.id])ids.push(...x.items);for(const c of COUNTS)if(num((room.cnt||{})[c.id])>0)ids.push(c.item);return [...new Set(ids)]}
function roomLines(room,v){const g=geo(room),L=[];
 for(const id of roomItems(room)){const it=CAT[id];let q=(g[it.b]||0)*it.k;q=it.c?Math.ceil(q-1e-9):Math.round(q*100)/100;if(q<=0)continue;const ov=(room.rates||{})[id]||{};const pr=Object.prototype.hasOwnProperty.call(ov,v)?ov[v]:priceOf(id,v);L.push({id,g:it.g,n:it.n,u:it.u,q,pr,sum:q*pr})}
 (room.custom||[]).forEach((c,ci)=>{const q=num(c.q),pr=c.rates&&Object.prototype.hasOwnProperty.call(c.rates,v)?c.rates[v]:num(c.p);if(q&&c.n)L.push({g:c.g||'w',n:c.n,u:c.u||'шт',q,pr,sum:q*pr,custom:1,ci})});
 return L}
function projTotals(p,v){let w=0,m=0;const rooms=(p.rooms||[]).map(r=>{const L=roomLines(r,v),rw=L.filter(l=>l.g==='w').reduce((s,l)=>s+l.sum,0),rm=L.filter(l=>l.g==='m').reduce((s,l)=>s+l.sum,0);w+=rw;m+=rm;return{r,L,rw,rm,g:geo(r)}});
 const sub=w+m,disc=sub*num(p.disc)/100,total=sub-disc,adv=total*num(p.adv)/100;return{rooms,w,m,sub,disc,total,adv}}

/* =================== plan drawing (shared by screen and PDF) =================== */
function openingPrims(o,pts,scale,sign=1){const a=pts[num(o.wall)-1],b=pts[num(o.wall)];if(!a||!b)return null;const dx=b[0]-a[0],dy=b[1]-a[1],L=Math.hypot(dx,dy);if(L<1e-6)return null;const width=Math.min(num(o.w)*scale,L),offset=o.offset==null?(L-width)/2:Math.max(0,Math.min(num(o.offset)*scale,L-width)),ux=dx/L,uy=dy/L;return{type:o.type,a:[a[0]+ux*offset,a[1]+uy*offset],b:[a[0]+ux*(offset+width),a[1]+uy*(offset+width)],nx:uy*sign,ny:-ux*sign,len:width,sign}}
function openingSVG(op,small=false){if(!op)return '';const[a,b,L]=[op.a,op.b,op.len],line=(a,b,c,w)=>`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${c}" stroke-width="${w}"/>`;let h=line(a,b,'white',small?4:10);if(op.type==='door'){const leaf=[a[0]-op.nx*L,a[1]-op.ny*L];h+=line(a,leaf,'#d96920',small?1:2)+`<path class="door-arc" d="M ${b.join(' ')} A ${L} ${L} 0 0 ${op.sign>0?1:0} ${leaf.join(' ')}" fill="none" stroke="#d96920" stroke-width="1.2"/>`}else{for(const v of [-2,2])h+=line([a[0]+op.nx*v,a[1]+op.ny*v],[b[0]+op.nx*v,b[1]+op.ny*v],'#238ab6',small?1:2);h+=line([a[0]-op.nx*4,a[1]-op.ny*4],[a[0]+op.nx*4,a[1]+op.ny*4],'#238ab6',2)+line([b[0]-op.nx*4,b[1]-op.ny*4],[b[0]+op.nx*4,b[1]+op.ny*4],'#238ab6',2)}return `<g class="${op.type==='door'?'op-door':'op-window'}">${h}</g>`}
function openingCanvas(ctx,op){if(!op)return;ctx.save();const line=(a,b,c,w)=>{ctx.beginPath();ctx.moveTo(...a);ctx.lineTo(...b);ctx.strokeStyle=c;ctx.lineWidth=w;ctx.stroke()};const[a,b,L]=[op.a,op.b,op.len];line(a,b,'white',8);if(op.type==='door'){const leaf=[a[0]-op.nx*L,a[1]-op.ny*L];line(a,leaf,'#d96920',1.3);ctx.beginPath();const angle=Math.atan2(b[1]-a[1],b[0]-a[0]);ctx.arc(a[0],a[1],L,angle,angle+op.sign*Math.PI/2,op.sign<0);ctx.lineWidth=1;ctx.strokeStyle='#d96920';ctx.stroke()}else{for(const v of [-2,2])line([a[0]+op.nx*v,a[1]+op.ny*v],[b[0]+op.nx*v,b[1]+op.ny*v],'#238ab6',1.5);for(const q of[a,b])line([q[0]-op.nx*4,q[1]-op.ny*4],[q[0]+op.nx*4,q[1]+op.ny*4],'#238ab6',1.5)}ctx.restore()}

function planPrims(room,W,H,pad){
 const g=geo(room),pts=g.pts,n=room.walls.length;const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]);
 let minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys);const span=Math.max(maxX-minX,maxY-minY,1);
 if(maxX-minX<0.5){minX-=1;maxX+=1}if(maxY-minY<0.5){minY-=1;maxY+=1}
 const s=Math.min((W-2*pad)/(maxX-minX||1),(H-2*pad)/(maxY-minY||1));const ox=(W-(maxX-minX)*s)/2-minX*s,oy=(H-(maxY-minY)*s)/2-minY*s;
 const T=p=>[ox+p[0]*s,oy+p[1]*s];const sp=pts.map(T);const walls=[];
 for(let i=0;i<n;i++){const a=sp[i],b=sp[i+1],dx=b[0]-a[0],dy=b[1]-a[1],L=Math.hypot(dx,dy)||1;const nx=dy/L*g.sign,ny=-dx/L*g.sign;
  walls.push({a,b,i,len:num(room.walls[i].len),mid:[(a[0]+b[0])/2,(a[1]+b[1])/2],nx,ny,ang:Math.atan2(dy,dx)})}
 const ops=(room.ops||[]).map(o=>openingPrims(o,sp,s,g.sign)).filter(Boolean);
 return{g,sp,walls,ops,s,closed:g.closed,end:sp[n],heading:g.heading,span}}
const FLOORC=room=>FIN.floor.opts[(room.fin||{}).floor||'none'].c;
function wallColor(room){const f=room.fin||{};if(f.walls==='tile')return '#9fb4c2';if(f.walls==='paint'||f.walls==='wallpaper')return room.wc||'#d9cbb5';return '#3a3d42'}
function planSVG(room,W,H,opts={}){
 if(!room.walls.length)return `<svg viewBox="0 0 ${W} ${H}" class="${opts.cls||''}"><text x="${W/2}" y="${H/2}" text-anchor="middle" fill="currentColor" opacity=".5" font-size="${opts.small?10:15}">${opts.small?'нет замеров':'Сделайте первый замер стены'}</text></svg>`;
 const P=planPrims(room,W,H,opts.small?6:46),fs=opts.small?0:13;let o=`<svg viewBox="0 0 ${W} ${H}" class="${opts.cls||''}" xmlns="http://www.w3.org/2000/svg">`;
 const poly=P.sp.slice(0,P.closed?-1:undefined).map(p=>p.join(',')).join(' ');
 if(P.closed)o+=`<polygon points="${poly}" fill="${FLOORC(room)}" opacity=".55"/>`;
 const wc=wallColor(room);
 P.walls.forEach(w=>{o+=`<line x1="${w.a[0]}" y1="${w.a[1]}" x2="${w.b[0]}" y2="${w.b[1]}" data-a="selectwall" data-i="${w.i}" stroke="${wc}" stroke-width="${opts.small?3:8}" stroke-linecap="round"/>`;
  o+=`<line x1="${w.a[0]}" y1="${w.a[1]}" x2="${w.b[0]}" y2="${w.b[1]}" pointer-events="none" stroke="#1d1f22" stroke-opacity=".35" stroke-width="${opts.small?.6:1.2}"/>`});
 P.ops.forEach(op=>{o+=openingSVG(op,opts.small)});
 if(!opts.small){P.walls.forEach(w=>{const lx=w.mid[0]+w.nx*22,ly=w.mid[1]+w.ny*22;
   o+=`<text x="${lx}" y="${ly}" text-anchor="middle" dominant-baseline="middle" font-size="${fs}" font-weight="700" fill="currentColor" paint-order="stroke" stroke="var(--surface)" stroke-width="4">${fmt(w.len,2)}</text>`;
   const ix=w.mid[0]-w.nx*16,iy=w.mid[1]-w.ny*16;o+=`<circle cx="${ix}" cy="${iy}" r="9" fill="var(--acc)"/><text x="${ix}" y="${iy}" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="700" fill="var(--acc-ink)">${w.i+1}</text>`});
  o+=`<circle cx="${P.sp[0][0]}" cy="${P.sp[0][1]}" r="5" fill="var(--ok)"/>`;
  if(!P.closed){const r=P.heading*Math.PI/180,e=P.end;o+=`<circle cx="${e[0]}" cy="${e[1]}" r="6" fill="var(--acc)"/><line x1="${e[0]}" y1="${e[1]}" x2="${e[0]+Math.cos(r)*26}" y2="${e[1]+Math.sin(r)*26}" stroke="var(--acc)" stroke-width="2" stroke-dasharray="4 3"/>`}}
 return o+'</svg>'}
function planCanvas(ctx,room,x,y,W,H){
 ctx.save();ctx.translate(x,y);ctx.strokeStyle='#ccc';ctx.lineWidth=.5;ctx.strokeRect(0,0,W,H);
 if(!room.walls.length){ctx.fillStyle='#888';ctx.font='10px '+PF;ctx.fillText('Нет замеров',10,20);ctx.restore();return}
 const P=planPrims(room,W,H,34);
 if(P.closed){ctx.beginPath();P.sp.slice(0,-1).forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();ctx.globalAlpha=.45;ctx.fillStyle=FLOORC(room);ctx.fill();ctx.globalAlpha=1}
 ctx.lineCap='round';P.walls.forEach(w=>{ctx.strokeStyle='#33363a';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(...w.a);ctx.lineTo(...w.b);ctx.stroke()});
 P.ops.forEach(op=>openingCanvas(ctx,op));
 ctx.textAlign='center';ctx.textBaseline='middle';
 P.walls.forEach(w=>{const lx=w.mid[0]+w.nx*14,ly=w.mid[1]+w.ny*14;ctx.font='bold 9px '+PF;ctx.lineWidth=3;ctx.strokeStyle='#fff';ctx.strokeText(fmt(w.len,2),lx,ly);ctx.fillStyle='#111';ctx.fillText(fmt(w.len,2),lx,ly);
  const ix=w.mid[0]-w.nx*11,iy=w.mid[1]-w.ny*11;ctx.fillStyle='#e0620d';ctx.beginPath();ctx.arc(ix,iy,6,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.font='bold 7px '+PF;ctx.fillText(w.i+1,ix,iy+.3)});
 ctx.restore()}

/* =================== rangefinder (Bosch GLM over BLE) =================== */
const SVC='02a6c0d0-0451-4000-b000-fb3210111989',CHR='02a6c0d1-0451-4000-b000-fb3210111989';
const BLE={state:'off',name:'',log:[],webChr:null};
function bleLog(s){BLE.log.push(new Date().toLocaleTimeString('ru-RU')+' '+s);if(BLE.log.length>60)BLE.log.shift();if(R.view==='settings')render()}
function parseFrame(bytes){
 bleLog('← '+[...bytes].map(b=>b.toString(16).padStart(2,'0')).join(' '));
 if(bytes.length>=11&&bytes[0]===0xC0&&bytes[1]===0x55&&bytes[2]===0x10){const dv=new DataView(new Uint8Array(bytes).buffer);const v=dv.getFloat32(7,true);if(isFinite(v)&&v>0.02&&v<300)onMeasure(Math.round(v*1000)/1000)}}
window.glmEvent=e=>{if(e.type==='status'){BLE.state=e.state;BLE.name=e.name||BLE.name;if(e.text)toast(e.text);render()}
 else if(e.type==='frame'){parseFrame(e.hex.match(/../g).map(h=>parseInt(h,16)))}else if(e.type==='log')bleLog(e.text)};
async function bleConnect(){
 if(NATIVE){NATIVE.bleConnect();BLE.state='connecting';render();return}
 if(!navigator.bluetooth){toast('В этом браузере нет Bluetooth. Вводите замеры вручную или используйте приложение для Android.');return}
 try{BLE.state='connecting';render();
  const dev=await navigator.bluetooth.requestDevice({filters:[{namePrefix:'GLM'},{namePrefix:'Bosch'},{services:[SVC]}],optionalServices:[SVC]});
  dev.addEventListener('gattserverdisconnected',()=>{BLE.state='off';render();toast('Дальномер отключён')});
  const srv=await (await dev.gatt.connect()).getPrimaryService(SVC),ch=await srv.getCharacteristic(CHR);
  await ch.startNotifications();ch.addEventListener('characteristicvaluechanged',e=>parseFrame(new Uint8Array(e.target.value.buffer)));
  await ch.writeValue(new Uint8Array([0xC0,0x55,0x02,0x01,0x00,0x1A]));BLE.webChr=ch;BLE.state='on';BLE.name=dev.name||'GLM';render();toast('Дальномер подключён')}
 catch(e){BLE.state='off';render();toast('Не удалось подключиться: '+e.message)}}
function bleMeasure(){if(NATIVE)NATIVE.bleMeasure();else if(BLE.webChr)BLE.webChr.writeValue(new Uint8Array([0xC0,0x56,0x01,0x00,0x1E])).catch(()=>{})}

/* =================== routing / state =================== */
let R={view:'home',pid:null,rid:null,tab:'rooms'};const STACK=[];
const UI={last:null,target:'wall',turn:90,auto:true,opType:'door'};
function go(v,extra={}){STACK.push({...R});R={...R,view:v,...extra};render();window.scrollTo(0,0)}
function back(){if(!STACK.length)return false;R=STACK.pop();render();return true}
window.appBack=()=>back();
const P=()=>DB.projects.find(p=>p.id===R.pid);
const RM=()=>{const p=P();return p&&p.rooms.find(r=>r.id===R.rid)};

function onMeasure(v){
 UI.last=v;const room=R.view==='room'?RM():null;
 if(!room){render();toast('Замер '+fmt(v,3)+' м — откройте помещение');return}
 if(UI.target==='wall'){if(room.closed){toast('Контур замкнут. Чтобы добавить стену, удалите последнюю или выберите «Высота»/«Проём»');render();return}
  if(UI.auto){addWall(room,v);toast('Стена '+room.walls.length+': '+fmt(v,3)+' м')}else{render();const i=$('#wlen');if(i)i.value=fmt(v,3)}}
 else if(UI.target==='height'){room.h=v;UI.target='wall';save();render();toast('Высота потолка: '+fmt(v,3)+' м')}
 else if(UI.target==='opw'||UI.target==='opready'){UI.opw=v;UI.oph=null;UI.target='oph';render();toast('Ширина проёма '+fmt(v,3)+'. Теперь высоту')}
 else if(UI.target==='oph'){UI.oph=v;UI.target='opready';render();toast('Высота проёма '+fmt(v,3)+' — нажмите «Добавить проём»')}
}
function addWall(room,len){if(len<=0)return;room.walls.push({len:Math.round(len*1000)/1000,t:room.walls.length?UI.turn:0});const g=geo(room);room.closed=g.closed;save();render()}
function closeRoom(room){const g=geo(room);if(room.walls.length<2){toast('Нужно минимум две стены');return}
 const e=g.pts[room.walls.length],d=Math.hypot(e[0],e[1]);if(d<0.03){room.closed=true;save();render();return}
 let t=Math.atan2(-e[1],-e[0])*180/Math.PI-g.heading;t=((t%360)+540)%360-180;room.walls.push({len:Math.round(d*1000)/1000,t:Math.round(t*10)/10});room.closed=true;save();render();toast('Контур замкнут: добавлена стена '+fmt(d,3)+' м')}

function bleCard(){const s=BLE.state;return `<div class="meas"><div class="grow"><div class="s">${s==='on'?'Дальномер: '+esc(BLE.name||'подключён'):s==='connecting'?'Подключение…':'Дальномер не подключён'}</div><div class="v">${UI.last!=null?fmt(UI.last,3)+' м':'— м'}</div></div>${s==='on'?'<button class="btn" data-a="measure">Замер</button>':'<button class="btn" data-a="ble">Подключить</button>'}</div>`}
function foot(html){return `<div class="foot"><div class="in">${html}</div></div>`}

function vHome(){

 return bar('Замер и смета','<button class="icon" data-a="settings" aria-label="Настройки">⚙</button>')+bleCard()+
 `<div class="list">${ps.length?ps.map(p=>{const t=projTotals(p,p.v||DB.settings.variant||'s');const r0=p.rooms[0];
  return `<button class="item" data-a="open" data-id="${p.id}">${r0?planSVG(r0,64,64,{small:1,cls:'thumb'}):'<div class="thumb"></div>'}<div class="grow"><div class="t">${esc(p.name||'Объект')}</div><div class="small muted">${esc(p.client||'Клиент не указан')} · ${p.rooms.length} пом. · ${esc(p.date||'')}</div></div><div class="small" style="font-weight:700">${rub(t.total)}</div></button>`}).join(''):
  '<div class="card"><h3>Как это работает</h3><p class="small muted" style="margin:0">1. Создайте объект и помещение.<br>2. Подключите дальномер Bosch GLM и мерьте стены по кругу — план рисуется сразу.<br>3. Выберите отделку: смета считается автоматически.<br>4. Сравните варианты и отправьте клиенту PDF.</p></div>'}</div>`+
 foot('<button class="btn" data-a="newproj">+ Новый объект</button>')}

 const tabs=[['rooms','Помещения'],['plan','План квартиры'],['est','Смета'],['var','Варианты'],['info','Клиент']];
 let h=bar(p.name||'Объект','<button class="icon" data-a="delproj" aria-label="Удалить объект">🗑</button>')+`<div class="tabs">${tabs.map(([k,n])=>`<button data-a="tab" data-t="${k}" aria-pressed="${R.tab===k}">${n}</button>`).join('')}</div>`;
 if(R.tab==='rooms'){
  h+=`<div class="list">${p.rooms.map(r=>{const g=geo(r);return `<button class="item" data-a="room" data-id="${r.id}">${planSVG(r,64,64,{small:1,cls:'thumb'})}<div class="grow"><div class="t">${esc(r.name)}</div><div class="small muted">${g.closed?'пол '+fmt(g.floor)+' м² · стены '+fmt(g.wall)+' м²':r.walls.length?'контур не замкнут · '+r.walls.length+' ст.':'нет замеров'}</div></div><div class="small">${rub(T.rooms.find(x=>x.r===r).rw+T.rooms.find(x=>x.r===r).rm)}</div></button>`}).join('')}</div>
  <h2>Добавить помещение</h2><div class="chips">${ROOM_NAMES.map(n=>`<button class="chip" data-a="addroom" data-n="${n}">+ ${n}</button>`).join('')}</div>`}
 if(R.tab==='plan')h+=vApartment(p);
 if(R.tab==='est'){

  T.rooms.forEach(x=>{h+=`<div class="card"><h3>${esc(x.r.name)} <span class="muted small">· пол ${fmt(x.g.floor)} м² · стены ${fmt(x.g.wall)} м²</span></h3>${linesTable(x.L,x.r,v)}<div class="tot"><span>Итого по помещению</span><b>${rub(x.rw+x.rm)}</b></div></div>`});
  h+=`<div class="card"><div class="grid2"><label class="f">Скидка, %<input inputmode="decimal" data-f="p.disc" value="${esc(p.disc||'')}"></label><label class="f">Аванс, %<input inputmode="decimal" data-f="p.adv" value="${esc(p.adv||'')}"></label></div>
   <div class="tot"><span>Работы</span><b>${rub(T.w)}</b></div><div class="tot"><span>Материалы</span><b>${rub(T.m)}</b></div>${T.disc?`<div class="tot"><span>Скидка ${fmt(p.disc)}%</span><b>−${rub(T.disc)}</b></div>`:''}
   <div class="tot big"><span>Итого (${vName(v)})</span><span>${rub(T.total)}</span></div>${T.adv?`<div class="tot"><span>Аванс ${fmt(p.adv)}%</span><b>${rub(T.adv)}</b></div>`:''}</div>
   <p class="small muted">Нажмите на цену, чтобы поставить свою. Для «Эконом», «Стандарт» и «Премиум» цены сохраняются отдельно в этом помещении. Общий прайс — в Настройках.</p>`}
 if(R.tab==='var'){

  h+=`<div class="card"><h3>Сравнение вариантов ремонта</h3><table class="cmp"><tr><th>Помещение</th>${VARS.map(([,n])=>`<th class="n">${n}</th>`).join('')}</tr>

  <tr><td><b>Итого</b></td>${all.map((t,i)=>`<td class="n ${VARS[i][0]===v?'best':''}"><b>${rub(t.total)}</b></td>`).join('')}</tr></table>

 if(R.tab==='info'){

  <label class="f">Телефон заказчика<input inputmode="tel" data-f="p.phone" value="${esc(p.phone||'')}"></label><label class="f">Адрес<input data-f="p.addr" value="${esc(p.addr||'')}"></label>
  <label class="f">Дата сметы<input data-f="p.date" value="${esc(p.date||'')}"></label><label class="f">Примечание для клиента<textarea data-f="p.note">${esc(p.note!=null?p.note:DB.settings.note)}</textarea></label></div>`}
 return h+foot('<button class="btn sec" data-a="pdfsave">Сохранить PDF</button><button class="btn" data-a="pdfshare">Отправить клиенту</button>')}

function linesTable(L,r,v){if(!L.length)return '<p class="small muted">Выберите отделку в помещении — строки сметы появятся здесь.</p>';
 const grp=(g,t)=>{const l=L.filter(x=>x.g===g);return l.length?`<tr><th colspan="4">${t}</th></tr>`+l.map(x=>`<tr><td>${esc(x.n)}</td><td class="n">${fmt(x.q)} ${esc(x.u)}</td><td class="n"><input class="rate" inputmode="decimal" data-f="rate.${r.id}.${x.custom?'c'+x.ci:x.id}.${v}" value="${x.pr}" aria-label="Цена: ${esc(x.n)}, ${vName(v)}" title="Ваша цена за ${esc(x.u)}"></td><td class="n">${rub(x.sum)}</td></tr>`).join(''):''};
 return `<table class="estimate"><colgroup><col style="width:36%"><col style="width:21%"><col style="width:23%"><col style="width:20%"></colgroup><tr><th>Наименование</th><th class="n">Кол-во</th><th class="n">Цена, ₽</th><th class="n">Сумма</th></tr>${grp('w','Работы')}${grp('m','Материалы')}</table>`}

function vRoom(){
 const p=P(),r=RM();if(!r)return vProject();const g=geo(r),v=p.v||DB.settings.variant||'s',f=r.fin||(r.fin={});r.cnt=r.cnt||{};

};
